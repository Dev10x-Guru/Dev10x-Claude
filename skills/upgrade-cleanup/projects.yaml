# Project roots to scan for .claude/settings.local.json
# Each root is scanned recursively for settings files containing
# versioned plugin paths. Worktree directories (.worktrees/) are
# included automatically.
#
# Copy this file to ~/.claude/skills/Dev10x:upgrade-cleanup/
# and customize with your own project roots:
#   uvx dev10x permission init

plugin_cache: ~/.claude/plugins/cache/Dev10x-Guru/Dev10x

roots: []
#  - /work/my-projects
#  - /work/team-repos

include_user_settings: true

# Workspace directories that must be registered with Claude Code for
# Write/Edit/Read tools to operate without per-call permission prompts.
# Allow-rules alone are NOT sufficient for paths outside the project
# root (GH-40). These are added under permissions.additionalDirectories
# in every settings file.
#
# GH-1260: the gate governs the Read/Write/Edit TOOLS ONLY. It does not
# gate Bash, and the two rule namespaces are independent — a `Read()`
# rule, allow or deny, has no bearing on a Bash command reading the same
# path. Adding a workspace directory therefore does NOT relieve Bash
# friction, and no `Read()` deny protects a path that `cat`/`rg`/`wc`
# can reach. Do not reach for either as a path-scoping remedy; a path is
# scopable only by an effect-based PreToolUse validator (the DX0xx
# axis), filesystem permissions, or not storing the secret in a readable
# file. Every `Read()` entry below is an ALLOW; the shipped catalog
# carries no `Read()` deny, so it makes no protection promise it cannot
# keep — keep it that way.
#
# GH-1325: the two namespaces differ in MATCHING as well as in reach.
# `Read`/`Edit`/`Write` patterns are gitignore patterns — `**` crosses
# directories, `*` stays inside one segment, and the leading token picks
# the anchor: `//` the filesystem root, `~/` the home directory, a lone
# `/` the settings source. In a `Bash(X:*)` rule the text before `:*` is
# a literal command prefix where `*` and `**` are plain characters
# (GH-1472). Enumerate by intent, collapse by
# redundancy: one tree rule replaces a per-subdirectory list, and no
# rule is widened to absorb a neighbour it was not granted for.
# Enforced by tests/skills/permission/test_path_rule_anchors.py.
workspace_directories:
  - /tmp/Dev10x
  # GH-254: skills read playbook overrides, plan-sync state, and
  # plugin assets from these well-known locations. Without them,
  # the additionalDirectories gate fires per-Read even when
  # the underlying tool is allowed.
  - ~/.claude/memory
  - ~/.claude/plugins
  - ~/.config/Dev10x

# Commands declared once and rendered as one `Bash(<prefix><command>:*)`
# allow-rule per spelling (GH-1317). Claude Code's rule matching is
# literal, so `uvx dev10x permission ensure-base` and the bare
# `dev10x permission ensure-base` a human types are two different rules;
# hand-listing them meant coverage depended on whoever added the entry
# remembering every runner. The block is folded into `base_permissions`
# at load time, so every reader downstream still sees flat rule strings.
command_spellings:
  # The three runners the docs, the skills and the humans all use.
  - prefixes: ["", "uvx ", "uv run "]
    commands:
      - dev10x permission clean
      - dev10x permission doctor
      - dev10x permission ensure-base
      - dev10x permission ensure-reads
      - dev10x permission ensure-scripts
      - dev10x permission ensure-workspace
      - dev10x permission enumerate-mcp
      - dev10x permission generalize
      - dev10x permission init
      - dev10x permission investigate
      - dev10x permission merge-worktree
      - dev10x permission sync-worktrees
      - dev10x permission ensure-ignored
      - dev10x permission record-upgrade
      - dev10x permission report
      - dev10x permission triage  # GH-1676; `grant` stays unseeded
      - dev10x permission update-paths
      - dev10x permission findings
      - dev10x doctor run
      - dev10x playbook diff
      - dev10x skill count-instructions
      - dev10x skill prune-overrides
      - dev10x supervisor serve
      - dev10x supervisor unit
      - dev10x config
      - dev10x platform
      - dev10x init
      - dev10x github-app

  # The foreman/watchdog spellings (GH-1317) are coding's: see
  # projects.d/coding.yaml.

# Base permissions that update-paths.py --ensure-base will add to every
# settings.local.json if missing.  These are stable, version-independent
# rules that every Dev10x plugin user needs.
#
# GH-98:  gh CLI patterns
# GH-120: /tmp/Dev10x/git/ temp file access
# GH-274: /tmp/Dev10x/bin/mktmp.sh for all namespaces
# GH-101: plugin cache broad rule (covers ${CLAUDE_PLUGIN_ROOT} scripts)
base_permissions:
  # --- Plugin infrastructure (GH-274, GH-101, GH-426) ---
  - "Bash(/tmp/Dev10x/bin/mktmp.sh:*)"

  # GH-1472: no Bash rule here may put a `*` before a trailing `:*`.
  # The text before `:*` is a literal prefix, so that `*` is a plain
  # character — the rule never matches and Claude Code flags it at every
  # startup. Do not "fix" one by switching to the space form
  # (`Bash(X *)`): there `*` matches any text, `..` and `-c` included, so
  # the rule would grant far more than it ever did. The GH-370 escape
  # folders (/tmp/Dev10x/*.py, ~/.claude/tools/*), the /home/*/ twins and
  # the cross-worktree git and `uv run --directory` spellings were all
  # this shape and were dropped. Enforced by
  # tests/skills/permission/test_catalog_rule_shapes.py.

  # --- Plugin scripts (GH-471) ---
  # Per-script Bash rules are NO LONGER listed here. They previously used
  # `cache/**/` globs, which Claude Code's Bash matcher treats literally —
  # the literal `**` never appears in a real command string, so the rules
  # never matched and every plugin script prompted. `update-paths` cannot
  # re-version a `**` rule either (no literal X.Y.Z segment to bump).
  #
  # Concrete, version-pinned rules
  # (`.../<version>/{bin,hooks,skills}/.../foo.{sh,py}:*`) are emitted by
  # `permission ensure-scripts` (from scan_plugin_scripts) and re-bumped by
  # `permission update-paths` on every upgrade. ensure-scripts also purges
  # any surviving dead `**` script rules from user settings, replacing them
  # with the concrete forms. See update_paths.is_dead_glob_script_rule.

  # GH-269: upgrade-cleanup/scripts/*.py shims were retired in favour
  # of the version-stable `uvx dev10x permission …` CLI. The
  # replacement allow-rules live below under "Dev10x CLI". The
  # `permission update-paths` rewriter migrates any legacy
  # per-script rules in user settings to the new CLI form.

  # --- Dev10x CLI (GH-269, GH-1317) ---
  # Declared once each under `command_spellings` below, which renders a
  # rule per runner prefix. Still per-subcommand — never
  # `Bash(uvx dev10x:*)` — so users can audit exactly which CLI
  # surfaces the plugin is authorized to use.

  # --- Dev10x config file access (GH-878, GH-135, GH-862) ---
  # Playbook overrides and other legacy read-only config live under
  # ~/.claude/memory/Dev10x — a Read seed keeps tier-2 resolution
  # prompt-free. No Write/Edit seeds under .claude/ are shipped:
  # ADR-0018 (GH-812) retired runtime writes there — durable state
  # moved to ~/.config/Dev10x and is written via the `dev10x` CLI,
  # not a Write/Edit allow rule (which trips Claude Code's
  # self-settings consent gate regardless, and is flagged by the
  # write-guard-claude scanner). The retired .claude/Dev10x/session.yaml
  # and config.yaml seeds were removed with the same change; in-repo
  # reads under .claude/Dev10x (e.g. project-local playbooks) need no
  # allow rule since the repo root is already a working directory.
  - "Read(~/.claude/memory/Dev10x/**)"
  # GH-315: the two Bash(grep:*<path>) rules below were removed.
  # Claude Code rejects :* in a non-trailing position ("The :* pattern
  # must be at the end"). They were also redundant — Bash(grep:*)
  # already covers all grep invocations.

  # --- Dev10x MCP tools: cli server (GH-878) ---
  # GH-1589: a tool's allow lives in the fragment of the plugin whose
  # skills declare it (projects.d/<plugin>.yaml). Tools declared by
  # skills of several plugins, or by none, stay here in core. Pinned by
  # tests/skills/permission/test_catalog_ownership.py.
  - "mcp__plugin_dev10x_cli__detect_tracker"
  - "mcp__plugin_dev10x_cli__pr_detect"
  - "mcp__plugin_dev10x_cli__issue_get"
  - "mcp__plugin_dev10x_cli__issue_comments"
  - "mcp__plugin_dev10x_cli__issue_comment_edit"
  - "mcp__plugin_dev10x_cli__issue_comment_delete"
  - "mcp__plugin_dev10x_cli__issue_create"
  - "mcp__plugin_dev10x_cli__pr_comments"
  - "mcp__plugin_dev10x_cli__push_safe"
  - "mcp__plugin_dev10x_cli__mktmp"
  - "mcp__plugin_dev10x_cli__plan_sync_set_context"
  - "mcp__plugin_dev10x_cli__plan_sync_json_summary"
  - "mcp__plugin_dev10x_cli__plan_sync_archive"
  # Test runners (GH-880, #877 E3 gap 1) — the diag-friction steer target
  # for scoped py/node tests. Without these, the steered one-liner
  # (run_node_tests(runner="npm", cwd=...)) just moves the prompt.
  # `run_tests` is coding's (projects.d/coding.yaml).
  - "mcp__plugin_dev10x_cli__run_node_tests"
  - "mcp__plugin_dev10x_cli__update_paths"
  - "mcp__plugin_dev10x_cli__audit_analyze_permissions"
  - "mcp__plugin_dev10x_cli__usage_blocks"
  # GH-1175: read-only catalog-coverage check behind dev10x:diag-friction
  # Step 3a. Catalogued in the same commit that registers the tool — the
  # friction-diagnosis skill's own first step must not be a prompt.
  - "mcp__plugin_dev10x_cli__permission_catalog_gap"
  # GH-1676: read-only triage behind dev10x:permission-grant and
  # dev10x:diag-approval. Its write twin, permission_grant, stays in
  # WRITE_TOOLS_NOT_SEEDED so its prompt remains the confirmation.
  - "mcp__plugin_dev10x_cli__permission_triage"
  # GH-1153's `triage_roster` lives in projects.d/scoping.yaml.
  # GH-1319: read-only milestone listing, the general-purpose counterpart
  # to triage_roster's open-milestone read. Read-only, so it belongs here
  # rather than in WRITE_TOOLS_NOT_SEEDED.
  - "mcp__plugin_dev10x_cli__milestone_list"
  # The same GH-1153 gap, found by that new test rather than by a user
  # hitting the prompt: five more registered read-only tools had never
  # been catalogued. `record_upgrade` is deliberately absent — it writes
  # the applied-version state, and writes keep prompting (it is named in
  # the test's WRITE_TOOLS_NOT_SEEDED list).
  - "mcp__plugin_dev10x_cli__audit_hook_log_path"
  - "mcp__plugin_dev10x_cli__audit_hook_recent"
  # GH-1153: registered read-only, never catalogued until the coverage
  # test found it. Core since diag-friction (core) and coding skills
  # both declare it (GH-1727).
  - "mcp__plugin_dev10x_cli__background_preamble"
  - "mcp__plugin_dev10x_cli__slack_thread_is_forward"

  # GH-1215: the guard added by GH-1153 scanned 5 of 12 mcp modules and
  # could not see the @github_tool decorator, so it passed green while
  # blind to roughly four fifths of the registered surface. Widening
  # discovery surfaced 36 more registered tools. The reads are below;
  # the writes split between the workflow-write block that follows and
  # enumerate_mcp.WRITE_TOOLS_NOT_SEEDED.
  #
  # resolve_gate is the headline: every skill gate has called it since
  # GH-1168, and it appears accepted-via-option-2 in three separate
  # repos' settings.local.json — once per checkout, forever.
  - "mcp__plugin_dev10x_cli__resolve_gate"
  - "mcp__plugin_dev10x_cli__preset_pin_status"
  - "mcp__plugin_dev10x_cli__supervisor_review_status"
  # GH-1261
  - "mcp__plugin_dev10x_cli__ide_status"
  - "mcp__plugin_dev10x_cli__list_client_roots"
  - "mcp__plugin_dev10x_cli__pr_get"
  # Review-pattern analysis (GH-346..GH-350). All four report only —
  # author_reference_rules is a dry run that returns rendered docs for
  # human review and writes no file.
  - "mcp__plugin_dev10x_cli__cluster_review_comments"
  - "mcp__plugin_dev10x_cli__candidate_rules_report"
  - "mcp__plugin_dev10x_cli__validate_candidate_patterns"
  - "mcp__plugin_dev10x_cli__author_reference_rules"
  - "mcp__plugin_dev10x_cli__rule_confidence_report"

  # --- Plugin-mandated workflow writes (GH-1215) ---
  # These write, and are catalogued anyway for the same reason
  # create_pr / issue_create / push_safe already are: every one of them
  # appears in the routed-CLI map in .claude/rules/mcp-tools.md, so the
  # skill-redirect hook blocks its raw equivalent and the wrapper is the
  # only route left. Leaving them uncatalogued makes the sanctioned path
  # prompt while the unsanctioned one is denied — a dead end, not a
  # safety margin.
  - "mcp__plugin_dev10x_cli__update_pr"
  - "mcp__plugin_dev10x_cli__pr_close"
  - "mcp__plugin_dev10x_cli__pr_issue_comment"
  - "mcp__plugin_dev10x_cli__pr_review_edit"
  - "mcp__plugin_dev10x_cli__resolve_review_thread"
  - "mcp__plugin_dev10x_cli__minimize_comments"
  - "mcp__plugin_dev10x_cli__milestone_edit"
  - "mcp__plugin_dev10x_cli__milestone_reopen"
  # issue_labels (GH-1322): same GH-1215 reasoning as pr_labels
  # (projects.d/coding.yaml) — its raw-CLI equivalent
  # (`gh issue edit --add-label`/`--remove-label`)  # cli-friction: allow raw-gh-issue — names the CLI it replaces
  # is routed/blocked, so this wrapper is the only sanctioned route.
  - "mcp__plugin_dev10x_cli__issue_labels"
  # ci_rerun (GH-1674): the only sanctioned route for re-running a check;
  # its raw form (a REST POST to `.../rerequest`) is on an ask rule,
  # and `gh run rerun` covers Actions only. Repo-bound with a retry cap.
  - "mcp__plugin_dev10x_cli__ci_rerun"
  # The milestone create/bulk writes are scoping's, milestone_close is
  # coding's, the park family's task_index_* writes are tasks', and the
  # db server's `query` is db's — each in its projects.d fragment.

  # --- Temp file tree (GH-878, GH-1095, GH-1325) ---
  # mktmp writes every skill's intermediate files under /tmp/Dev10x/.
  # One tree rule covers the whole namespace: `Read`/`Edit` rules are
  # gitignore patterns, so `**` crosses directories, and the leading
  # `//` anchors at the filesystem root — a single `/` would anchor at
  # the settings source instead. Adding a mktmp namespace needs no
  # catalog edit; do not re-enumerate them.
  - "Read(//tmp/Dev10x/**)"
  - "Edit(//tmp/Dev10x/**)"

  # --- gh and git CLI (GH-98 and later) ---
  # Every `Bash(gh …)` and `Bash(git …)` allow, the git aliases, the
  # GitHub SSH probe and the test, lint and pre-commit runners live in
  # projects.d/coding.yaml (GH-1589). The pager denies stay below in
  # `base_denies`: a floor belongs to core.

  # --- Read-only discovery in plugin cache (GH-122) ---
  # `Bash(find:*)` does not reliably match `find <path> ... | head`
  # due to how the engine tokenizes prefixes with pipelines. Scope
  # the rule to the plugin cache so common skills (work-on,
  # skill-audit, skill-create) can scan without a prompt. Scoped to
  # the publisher dir so both the kebab-case `dev10x` install and a
  # legacy `Dev10x` one match (GH-1499).
  - "Bash(find ~/.claude/plugins/cache/Dev10x-Guru:*)"

  # --- QA evidence inspection (GH-1141) ---
  # `Bash(identify:*)` lives in projects.d/qa.yaml.

  # --- Python project tooling (GH-20) ---
  # PEP 723 shebangs (#!/usr/bin/env -S uv run --script) execute
  # via direct script paths already enumerated under "Plugin
  # scripts". The rule below covers the Dev10x CLI through `uv run`;
  # the test, lint and dependency runners are coding's.
  - "Bash(uv run dev10x:*)"

  # --- Temp-file staging (GH-1189) ---
  # `cp`/`mv` under the plugin's own scratch roots prompted on an
  # unattended foreman run while `catalog-gap` reported 0 missing. The
  # filed diagnosis blamed `prefix:*` matcher semantics; the verifiable
  # cause is narrower and is GH-1149 a second time — `Bash(cp /tmp:*)`
  # exists ONLY in src/dev10x/core/skills/permission/baseline-permissions.yaml
  # (file-ops tier), which `permission resolve/audit/doctor` read and the
  # `ensure-base` write path never does. A rule present only there reaches
  # no settings file, and under GH-47 the project file wins, so a global
  # copy does not rescue it.
  #
  # Both shapes ship because the matcher question is not settled: the
  # prefix form is what the other tier uses, and the slash-continued glob
  # is what every real path the plugin hands out via `mktmp` actually
  # looks like (/tmp/Dev10x/<ns>/<name>). If the prefix form alone were
  # sufficient the glob is inert; if it is not, the glob is the rule that
  # works. Neither reaches outside a scratch root.
  - "Bash(cp /tmp:*)"
  - "Bash(cp /tmp/*)"
  - "Bash(mv /tmp:*)"
  - "Bash(mv /tmp/*)"

  # --- YAML config parsing (GH-20) ---
  # Skills like slack-review-request, verify-acc-dod, and
  # request-review shell out to `yq` to read user config under
  # ~/.claude/memory/Dev10x/*.yaml. Read access on the file is
  # already covered above; this rule covers the yq invocation.
  - "Bash(yq:*)"

  # --- Structured-data + safe-lookup tools (GH-308) ---
  # Read-only data-format tools and binary-existence lookups.
  # `dev10x:diag-friction` steers agents toward these as structured
  # alternatives to `python -c` / `sh -c` — their inclusion here makes
  # the recommendation actionable (invoking jq/yamllint/etc. never
  # prompts). `yq` already covered above under "YAML config parsing".
  #
  # Caveat: bare `command`/`which`/`type` can execute arbitrary binaries
  # (`command <bin> <args>`); only the lookup-flag forms are listed.
  # Do NOT generalize to `Bash(command:*)`.
  - "Bash(jq:*)"
  - "Bash(yamllint:*)"
  - "Bash(actionlint:*)"
  - "Bash(tomlq:*)"
  - "Bash(xq:*)"
  - "Bash(pup:*)"
  - "Bash(bash -n:*)"
  - "Bash(shellcheck:*)"
  - "Bash(shfmt:*)"
  - "Bash(zsh -n:*)"
  - "Bash(command -v:*)"
  - "Bash(command -V:*)"
  - "Bash(which:*)"
  - "Bash(type:*)"
  - "Bash(hash:*)"

  # --- Safe-by-default command catalog (GH-310) ---
  # Goal: an unsupervised (adaptive / AFK) session must never stall on a
  # permission prompt for a command that is safe to run. Every prompt is
  # BOTH a hard stop for an unattended session AND the trigger for Claude
  # Code's option-2 "Yes, and don't ask again" footgun, which writes a
  # dangerous catch-all `Bash(<verb> *)` into the user's allow list.
  #
  # Why allow, not deny (GH-310): a `deny: Bash(git *)` does NOT neutralize
  # the footgun — Claude Code evaluates deny -> ask -> allow and the first
  # match wins, and `Bash(git *)` matches ALL `git <args>` (the space-star
  # is a trailing wildcard). So a catch-all deny would also block
  # `git status`, `git log`, etc. for every user. The only safe defense is
  # to pre-approve the safe surface proactively, so the prompt never fires
  # and option-2 never gets the chance.
  #
  # Boundary — deliberately NOT listed here (these keep prompting, route to
  # a skill, or are forbidden by a hook): arbitrary code execution
  # (`python -c`, `sh -c`, `bash -c`, `eval`, package runners like
  # `npx <pkg>` / `pnpm dlx <pkg>` / `pipx run <pkg>` / `bunx <pkg>`),
  # network fetch-and-exec or exfil (`curl <url>`, `wget <url>` beyond
  # `--version`), destructive filesystem ops, env-prefixed commands
  # (`env VAR=x cmd` — GH-311), and the bare-verb catch-alls themselves.

  # Read-only filesystem & text inspection — never mutate state
  - "Bash(ls:*)"
  - "Bash(cat:*)"
  - "Bash(head:*)"
  - "Bash(tail:*)"
  - "Bash(wc:*)"
  - "Bash(tree:*)"
  - "Bash(file:*)"
  - "Bash(stat:*)"
  - "Bash(du:*)"
  - "Bash(df:*)"
  - "Bash(pwd)"
  - "Bash(realpath:*)"
  - "Bash(readlink:*)"
  - "Bash(basename:*)"
  - "Bash(dirname:*)"
  - "Bash(nl:*)"
  - "Bash(grep:*)"
  - "Bash(egrep:*)"
  - "Bash(fgrep:*)"
  - "Bash(rg:*)"
  - "Bash(sort:*)"
  - "Bash(uniq:*)"
  - "Bash(cut:*)"
  - "Bash(column:*)"
  - "Bash(comm:*)"
  - "Bash(diff:*)"
  - "Bash(echo:*)"
  - "Bash(printf:*)"
  - "Bash(date:*)"
  # GH-1664: read-only load/uptime probe; prompted in a seeded session.
  - "Bash(uptime:*)"

  # Version / help info flags for the option-2 footgun verbs — always safe
  # (the git and gh ones are coding's)
  - "Bash(bash --version)"
  - "Bash(sh --version)"
  - "Bash(uv --version)"
  - "Bash(uvx --version)"
  - "Bash(npx --version)"
  - "Bash(npm --version)"
  - "Bash(pnpm --version)"
  - "Bash(pipx --version)"
  - "Bash(bun --version)"
  - "Bash(claude --version)" # GH-1664
  - "Bash(yarn --version)"
  - "Bash(node --version)"
  - "Bash(python --version)"
  - "Bash(python3 --version)"
  - "Bash(curl --version)"
  - "Bash(wget --version)"
  - "Bash(env --version)"
  - "Bash(xargs --version)"
  - "Bash(make --version)"

  # uv — read-only environment inspection (test/lint/run already covered)
  - "Bash(uv pip list:*)"
  - "Bash(uv tree:*)"

