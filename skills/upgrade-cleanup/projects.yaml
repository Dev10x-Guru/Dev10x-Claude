  - "Bash(pre-commit run:*)"

  # --- Temp-file staging (GH-1189) ---
  # `cp`/`mv` under the plugin's own scratch roots prompted on an
  # unattended foreman run while `catalog-gap` reported 0 missing. The
  # filed diagnosis blamed `prefix:*` matcher semantics; the verifiable
  # cause is narrower and is GH-1149 a second time — `Bash(cp /tmp:*)`
