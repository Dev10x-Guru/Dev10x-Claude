# Project roots to scan for .claude/settings.local.json
# Each root is scanned recursively for settings files containing
# versioned plugin paths. Worktree directories (.worktrees/) are
# included automatically.
#
# Copy this file to ~/.claude/skills/Dev10x:upgrade-cleanup/
# and customize with your own project roots:
#   uvx dev10x permission init

plugin_cache: ~/.claude/plugins/cache/Dev10x-Guru/Dev10x

roots: []
#  - /work/my-projects
#  - /work/team-repos

include_user_settings: true

# Workspace directories that must be registered with Claude Code for
# Write/Edit/Read tools to operate without per-call permission prompts.
# Allow-rules alone are NOT sufficient for paths outside the project
# root (GH-40). These are added under permissions.additionalDirectories
# in every settings file.
workspace_directories:
  - /tmp/Dev10x
  # GH-254: skills read playbook overrides, plan-sync state, and
  # plugin assets from these well-known locations. Without them,
  # the additionalDirectories gate fires per-Read/Bash even when
  # the underlying tool is allowed.
  - ~/.claude/memory
  - ~/.claude/plugins
  - ~/.config/Dev10x

# Base permissions that update-paths.py --ensure-base will add to every
# settings.local.json if missing.  These are stable, version-independent
# rules that every Dev10x plugin user needs.
#
# GH-98:  gh CLI patterns
# GH-120: /tmp/Dev10x/git/ temp file access
# GH-274: /tmp/Dev10x/bin/mktmp.sh for all namespaces
# GH-101: plugin cache broad rule (covers ${CLAUDE_PLUGIN_ROOT} scripts)
base_permissions:
  # --- Plugin infrastructure (GH-274, GH-101, GH-426) ---
  - "Bash(/tmp/Dev10x/bin/mktmp.sh:*)"

  # --- Arbitrary-code escape destinations (GH-370) ---
  # GH-308 steers agents to extract inline probes into /tmp/Dev10x/*.py
  # or ~/.claude/tools/*.py. Write is already permitted; without these,
  # executing the extracted script prompts again (GH-271 #192, #215).
  - "Bash(/tmp/Dev10x/*.py:*)"
  - "Bash(/tmp/Dev10x/**/*.py:*)"
  - "Bash(/tmp/Dev10x/*.sh:*)"
  - "Bash(/tmp/Dev10x/**/*.sh:*)"
  - "Bash(~/.claude/tools/*:*)"
  - "Bash(~/.claude/tools/*.py:*)"
  - "Bash(~/.claude/tools/*.sh:*)"
  - "Bash(/home/*/.claude/tools/*:*)"

  # --- Plugin scripts (GH-471) ---
  # Per-script Bash rules are NO LONGER listed here. They previously used
  # `cache/**/` globs, which Claude Code's Bash matcher treats literally —
  # the literal `**` never appears in a real command string, so the rules
  # never matched and every plugin script prompted. `update-paths` cannot
  # re-version a `**` rule either (no literal X.Y.Z segment to bump).
  #
  # Concrete, version-pinned rules
  # (`.../<version>/{bin,hooks,skills}/.../foo.{sh,py}:*`) are emitted by
  # `permission ensure-scripts` (from scan_plugin_scripts) and re-bumped by
  # `permission update-paths` on every upgrade. ensure-scripts also purges
  # any surviving dead `**` script rules from user settings, replacing them
  # with the concrete forms. See update_paths.is_dead_glob_script_rule.

  # GH-269: upgrade-cleanup/scripts/*.py shims were retired in favour
  # of the version-stable `uvx dev10x permission …` CLI. The
  # replacement allow-rules live below under "Dev10x CLI". The
  # `permission update-paths` rewriter migrates any legacy
  # per-script rules in user settings to the new CLI form.

  # --- Dev10x CLI (GH-269) ---
  # Per-subcommand rules — never `Bash(uvx dev10x:*)` — so users can
  # audit exactly which CLI surfaces the plugin is authorized to use.
  - "Bash(uvx dev10x permission clean:*)"
  - "Bash(uvx dev10x permission doctor:*)"
  - "Bash(uvx dev10x permission ensure-base:*)"
  - "Bash(uvx dev10x permission ensure-reads:*)"
  - "Bash(uvx dev10x permission ensure-scripts:*)"
  - "Bash(uvx dev10x permission ensure-workspace:*)"
  - "Bash(uvx dev10x permission enumerate-mcp:*)"
  - "Bash(uvx dev10x permission generalize:*)"
  - "Bash(uvx dev10x permission init:*)"
  - "Bash(uvx dev10x permission investigate:*)"
  - "Bash(uvx dev10x permission merge-worktree:*)"
  - "Bash(uvx dev10x permission record-upgrade:*)"
  - "Bash(uvx dev10x permission update-paths:*)"
  - "Bash(uvx dev10x playbook diff:*)"
  - "Bash(uvx dev10x skill count-instructions:*)"
  - "Bash(uvx dev10x config:*)"
  - "Bash(uvx dev10x platform:*)"
  - "Bash(uvx dev10x init:*)"
  - "Bash(uvx dev10x github-app:*)"

