# GH-1261
#
# GH-1403: the `jetbrains` -> `pycharm` server rename dropped two of the
# five execution surfaces. A deny keys on a tool NAME, so a rename silently
# narrows coverage while every remaining rule still looks correct.
# `configure_python_interpreter` is deliberately absent: it mutates IDE
# configuration and executes nothing itself, and every tool that would run
# under that interpreter is already denied here.
ide_denies:
  pycharm:
  - "mcp__pycharm__execute_terminal_command"
  - "mcp__pycharm__execute_code_on_kernel"
  - "mcp__pycharm__execute_tool"
  - "mcp__pycharm__execute_run_configuration"
  - "mcp__pycharm__run_notebook_cell"
  - "mcp__pycharm__build_project"

# --- Base ask rules (GH-1154) ---
# The prompt tier. Until this key existed the catalog could express only
# allow and deny, so a rule that *should* prompt had nowhere to live and
# never reached a project file.
#
# Why ask and not deny: DX014's own rationale (.claude/rules/hook-patterns.md)
# is that a sensitive-but-legitimate operation must prompt rather than
# hard-block — a deny drops the user into a manual `!` shell with no
# in-session recourse. Deny stays reserved for operations that are never
# permitted (see base_denies below).
#
# Why these eight: `Bash(gh api:*)` is allowed in 34 project settings
# files, which covers every write method too. The guardrails below
# existed in exactly two places — the user's global `ask` list and one
# project's `deny` — and per GH-47 a project file wins outright, so in
# the other 32 checkouts the DELETE shape was unguarded.  # cli-friction: allow raw-gh-api — names the shape being guarded, not a command to run
# That also slips past the `gh repo delete` deny, which is a
# different command shape entirely.
#
# These do NOT break the sanctioned MCP path. `milestone_create`,
# `milestone_edit` and `milestone_reopen` do issue write-method calls  # cli-friction: allow raw-gh-api — explains why the MCP path is unaffected
# via `_gh_api_raw` -> subprocess *inside the MCP server process*
# (src/dev10x/coding/github/milestones.py, through core/github/_gateway.py).
# Claude Code permission rules gate tool calls, so no Bash-layer rule —
# ask or deny — can reach them.
#
# KNOWN LIMITATION (inherited from the shapes these replace, not
# introduced here): rule matching is prefix-based, so these only match
# when the method flag directly follows the subcommand. A command  # cli-friction: allow raw-gh-api — documents a matching limitation
# written with the endpoint first does not match and still falls
# through to `Bash(gh api:*)`. Closing that needs a hook-side check
# on the parsed argv, not more prefix rules — tracked on GH-1100.
base_asks:
  - "Bash(gh api --method DELETE:*)"
  - "Bash(gh api --method PATCH:*)"
  - "Bash(gh api --method POST:*)"
  - "Bash(gh api --method PUT:*)"
  - "Bash(gh api -X DELETE:*)"
  - "Bash(gh api -X PATCH:*)"
  - "Bash(gh api -X POST:*)"
  - "Bash(gh api -X PUT:*)"

# --- Base deny rules (GH-204) ---
# Tracker-independent denies. Tracker-specific ones live above.
base_denies:
  # GH-1261, GH-1403 — unconditional, not keyed to the pinned IDE.
  - "mcp__pycharm__execute_terminal_command"
  - "mcp__pycharm__execute_code_on_kernel"
  - "mcp__pycharm__execute_tool"
  - "mcp__pycharm__execute_run_configuration"
  - "mcp__pycharm__run_notebook_cell"
  - "mcp__pycharm__build_project"

  # --- Privilege-escalation tier (GH-326) ---
  # `sudo` and friends are denied for ANY shape, not just the option-2
  # catch-all. Unlike the GH-310 `<verb> *` footguns (which merely widen a
  # verb's argument surface), privilege escalation INVERTS the privilege
  # model: the wrapped command runs as root, bypassing every user-level
  # permission rule and hook. A single successful `sudo` allow therefore
  # defeats every other deny in this catalog (rm guards, write gates, the
  # Linear deletes above). That makes this tier categorically above
  # `destructive` — it invalidates all other tiers.
  #
  # Trigger: GH-271 evidence #212 — the agent attempted
  # `sudo -n rm -rf /work/bl/.worktrees/bl-zebra-4` (privilege escalation +
  # non-interactive + recursive destructive removal on a workspace).
  #
  # Per deny-overrides, these stay in force even if a user accidentally
  # allow-lists `sudo` somewhere. Users who genuinely want routine package
  # management opt into the narrow `sudo-apt` group (see
  # baseline-permissions.yaml) — which requires the doctor to scope this
  # deny down, since deny-first precedence means a blanket allow cannot
  # override a blanket deny.
  - "Bash(sudo:*)"      # any sudo invocation
  - "Bash(sudo *)"      # catch-all shape (option-2 footgun)
  - "Bash(sudo -n *)"   # non-interactive — silently bypasses the password prompt
  - "Bash(sudo -i *)"   # interactive root login shell
  - "Bash(sudoedit:*)"
  - "Bash(doas:*)"      # OpenBSD/Alpine equivalent
  - "Bash(doas *)"
  - "Bash(pkexec:*)"    # polkit-based privilege escalation
  - "Bash(pkexec *)"

  # --- Pager tier (GH-1248) ---
  # `git -P` / `git --no-pager` prefix a git verb, which shifts the effective
  # command prefix and defeats allow-rule matching for every `Bash(git <verb>:*)`
  # rule in this catalog — the same prefix-shift problem documented for env-var
  # prefixes. Neither pager shape is in base_permissions, so denying them is
  # additive hardening rather than a behavior change: today they fall through
  # to a prompt. Git is already non-interactive under Claude Code, so the pager
  # flags buy nothing that would be lost.
  #
  # `git -C` shares the prefix-shift mechanism but NOT this conclusion, and
  # this comment used to conflate the two (GH-1268). The cross-worktree `-C`
  # read verbs ARE seeded above, deliberately: unlike a pager flag, `-C <path>`
  # buys something nothing else does — reaching another checkout — so it is
  # spelled out per verb rather than denied.
  - "Bash(git -P:*)"
  - "Bash(git --no-pager:*)"
