  # `ensure-base` write path never does. A rule present only there reaches
  # no settings file, and under GH-47 the project file wins, so a global
  # copy does not rescue it.
  #
  # Both shapes ship because the matcher question is not settled: the
  # prefix form is what the other tier uses, and the slash-continued glob
  # is what every real path the plugin hands out via `mktmp` actually
  # looks like (/tmp/Dev10x/<ns>/<name>). If the prefix form alone were
  # sufficient the glob is inert; if it is not, the glob is the rule that
  # works. Neither reaches outside a scratch root.
  - "Bash(cp /tmp:*)"
  - "Bash(cp /tmp/*)"
  - "Bash(mv /tmp:*)"
  - "Bash(mv /tmp/*)"

