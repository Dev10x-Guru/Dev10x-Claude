  - "WebFetch(domain:docs.sentry.io)"
  - "WebFetch(domain:resend.com)"

  # --- Dev10x skills ---
  - "Skill(dev10x:*)"

  # NOTE (GH-768): issue-tracker MCP rules are NOT listed here. They live
  # under `tracker_permissions:` (projects.d/scoping.yaml) and
  # `tracker_denies:` (below), keyed by tracker, and only the project's
  # chosen tracker's block is folded in at seeding time. Listing Linear
  # unconditionally gave a Jira user ~35 inert allows while their own
  # tracker still prompted.

# --- Tracker-keyed permissions (GH-768) ---
# `tracker_permissions` lives in projects.d/scoping.yaml (GH-1551,
# ADR-0034 Stage A3): it is the tickets + scoping plugin's fragment and
# is merged back into this catalog on every read, so every reader still
# sees one catalog. The deny half stays here — a floor belongs to core.

# --- Tracker-keyed deny rules (GH-768) ---
# Destructive operations that must NEVER be auto-approved, even when a
# project broadens its `permissions.allow` via wildcards. Seeded only
# alongside their own tracker's allows — a Jira user has no use for the
# Linear deletes, and vice versa.
tracker_denies:
  # The Linear `delete_*` tools have shown up in 14× projects under blanket
  # `mcp__claude_ai_Linear__*` allow rules — these belong in deny (GH-204).
  linear:
  - "mcp__claude_ai_Linear__delete_customer"
  - "mcp__claude_ai_Linear__delete_customer_need"
  - "mcp__claude_ai_Linear__delete_comment"
  - "mcp__claude_ai_Linear__delete_attachment"
  - "mcp__claude_ai_Linear__delete_status_update"

