# Permission-catalog fragment for the tickets + scoping plugin
# (ADR-0034 Stage A3, GH-1551, GH-1589). Merged into ../projects.yaml by
# dev10x.core.skills.permission.catalog_paths; see that file's header
# for the catalog itself. Lists append after core's and the earlier
# plugins' in src/dev10x/core/plugins.yaml order, so the merged catalog
# holds every rule the one-file original did, in a new order.

base_permissions:
  # --- Dev10x MCP tools: cli server (GH-878) ---
  # GH-1153: read-only milestone/label roster behind dev10x:ticket-create
  # Step 4. It was registered, declared in SKILL.md `allowed-tools`, and
  # listed in .claude/rules/mcp-tools.md — none of which grants anything.
  # Absent from every catalog, ensure-base could never seed it, so every
  # caller prompted. test_catalog_covers_mcp_tools.py now fails on any
  # un-catalogued read tool so this cannot recur silently.
  - "mcp__plugin_dev10x_cli__triage_roster"
  # GH-1359: read-only, mirrors issue_list — no gh api fallback needed.  # cli-friction: allow raw-gh-api — names the CLI it replaces
  - "mcp__plugin_dev10x_cli__pr_list"
  # Plugin-mandated workflow writes (GH-1215): the raw-CLI equivalents
  # are routed to these wrappers, so leaving them uncatalogued makes the
  # sanctioned path prompt while the unsanctioned one is denied.
  - "mcp__plugin_dev10x_cli__milestone_create"
  - "mcp__plugin_dev10x_cli__milestones_bulk_create"
  - "mcp__plugin_dev10x_cli__issues_bulk_create"
  - "mcp__plugin_dev10x_cli__issues_bulk_edit"

# --- Tracker-keyed permissions (GH-768) ---
# `ensure-base` / `seed_worktree` fold in exactly ONE of these blocks —
# the tracker resolved from the `tracker:` key in the matching
# `projects[]` entry of ~/.config/Dev10x/friction.yaml, defaulting to
# `linear` (the pre-GH-768 behavior, so upgrades lose nothing).
#
# v1 covers linear / jira / github. GitLab and ClickUp are deliberately
# absent: ClickUp has no native skill or MCP path, and the `glab` surface
# has not been curated — an empty block would read as "supported".
#
# When PAP-2 lands the structured Policy catalog, these become a
# `tracker:` key on catalog groups and this block goes away.
#
# The tracker deny rules stay in ../projects.yaml (`tracker_denies`):
# they are a safety floor, and a floor belongs to core.
tracker_permissions:

  # --- Linear MCP tools (GH-204) ---
  # Group A: read-only operations — always safe.
  # Group B: write operations — frequently used by Dev10x skills
  # (ticket-create, ticket-scope, ticket-jtbd, investigate, qa-scope).
  # Group C delete tools are listed under `tracker_denies.linear` in
  # ../projects.yaml.
  # Both server name variants are covered:
  #   - `mcp__claude_ai_Linear__*` (claude.ai-hosted Linear connector)
  #   - `mcp__linear-server__*`    (self-installed linear-server MCP)
  linear:
  # Group A — read-only (claude.ai-hosted variant)
  - "mcp__claude_ai_Linear__get_issue"
  - "mcp__claude_ai_Linear__get_project"
  - "mcp__claude_ai_Linear__get_initiative"
  - "mcp__claude_ai_Linear__get_team"
  - "mcp__claude_ai_Linear__get_user"
  - "mcp__claude_ai_Linear__get_milestone"
  - "mcp__claude_ai_Linear__get_document"
  - "mcp__claude_ai_Linear__get_issue_status"
  - "mcp__claude_ai_Linear__get_status_updates"
  - "mcp__claude_ai_Linear__get_attachment"
  - "mcp__claude_ai_Linear__list_issues"
  - "mcp__claude_ai_Linear__list_projects"
  - "mcp__claude_ai_Linear__list_initiatives"
  - "mcp__claude_ai_Linear__list_milestones"
  - "mcp__claude_ai_Linear__list_teams"
  - "mcp__claude_ai_Linear__list_users"
  - "mcp__claude_ai_Linear__list_cycles"
  - "mcp__claude_ai_Linear__list_comments"
  - "mcp__claude_ai_Linear__list_issue_labels"
  - "mcp__claude_ai_Linear__list_issue_statuses"
  - "mcp__claude_ai_Linear__list_project_labels"
  - "mcp__claude_ai_Linear__list_documents"
  - "mcp__claude_ai_Linear__list_customers"
  - "mcp__claude_ai_Linear__search_documentation"
  - "mcp__claude_ai_Linear__extract_images"
  - "mcp__claude_ai_Linear__get_diff"
  - "mcp__claude_ai_Linear__get_diff_threads"
  - "mcp__claude_ai_Linear__list_diffs"

  # Group A — read-only (linear-server variant, GH-1323).
  # The claude.ai-hosted block above is NOT the namespace Dev10x
  # sessions actually call — `mcp__linear-server__*` is. Every read op
  # in the claude.ai-hosted list has a same-named counterpart here;
  # this block mirrors it one-for-one so the two stay at parity (see
  # tests/skills/permission/test_linear_namespace_parity.py). Before
  # GH-1323 only 5 of these 28 were catalogued, so the other 23 had
  # accumulated as ad-hoc per-call approvals in userspace settings.
  - "mcp__linear-server__get_issue"
  - "mcp__linear-server__get_project"
  - "mcp__linear-server__get_initiative"
  - "mcp__linear-server__get_team"
  - "mcp__linear-server__get_user"
  - "mcp__linear-server__get_milestone"
  - "mcp__linear-server__get_document"
  - "mcp__linear-server__get_issue_status"
  - "mcp__linear-server__get_status_updates"
  - "mcp__linear-server__get_attachment"
  - "mcp__linear-server__list_issues"
  - "mcp__linear-server__list_projects"
  - "mcp__linear-server__list_initiatives"
  - "mcp__linear-server__list_milestones"
  - "mcp__linear-server__list_teams"
  - "mcp__linear-server__list_users"
  - "mcp__linear-server__list_cycles"
  - "mcp__linear-server__list_comments"
  - "mcp__linear-server__list_issue_labels"
  - "mcp__linear-server__list_issue_statuses"
  - "mcp__linear-server__list_project_labels"
  - "mcp__linear-server__list_documents"
  - "mcp__linear-server__list_customers"
  - "mcp__linear-server__search_documentation"
  - "mcp__linear-server__extract_images"
  - "mcp__linear-server__get_diff"
  - "mcp__linear-server__get_diff_threads"
  - "mcp__linear-server__list_diffs"

  # `get_release` has no `claude_ai_Linear` counterpart — it exists
  # only in the linear-server namespace. Folded in here (not part of
  # the parity mirror above) because it had already accumulated as a
  # standalone ad-hoc allow in userspace settings; a genuine read-only
  # op with demonstrated real usage, not a blanket namespace grant.
  - "mcp__linear-server__get_release"

  # Group B — write (claude.ai-hosted variant)
  - "mcp__claude_ai_Linear__save_comment"
  - "mcp__claude_ai_Linear__save_issue"
  - "mcp__claude_ai_Linear__save_project"
  - "mcp__claude_ai_Linear__save_milestone"
  - "mcp__claude_ai_Linear__save_status_update"
  - "mcp__claude_ai_Linear__save_initiative"
  - "mcp__claude_ai_Linear__save_document"

  # Group B — write (linear-server variant)
  - "mcp__linear-server__save_issue"
  - "mcp__linear-server__save_project"

  # --- Jira / Atlassian MCP tools (GH-768) ---
  # The claude.ai-hosted Atlassian Rovo connector. `baseline-permissions.yaml`
  # already carries the same surface as the tier-2 `mcp-atlassian-readonly` /
  # `mcp-atlassian-write` groups; this block is what the FLAT catalog
  # (`ensure-base` / `seed_worktree`) actually deploys, which is where the
  # Jira user's gap was.
  jira:
  # Read-only
  - "mcp__claude_ai_Atlassian_Rovo__atlassianUserInfo"
  - "mcp__claude_ai_Atlassian_Rovo__getAccessibleAtlassianResources"
  - "mcp__claude_ai_Atlassian_Rovo__getVisibleJiraProjects"
  - "mcp__claude_ai_Atlassian_Rovo__getJiraIssue"
  - "mcp__claude_ai_Atlassian_Rovo__getJiraIssueRemoteIssueLinks"
  - "mcp__claude_ai_Atlassian_Rovo__getJiraIssueTypeMetaWithFields"
  - "mcp__claude_ai_Atlassian_Rovo__getJiraProjectIssueTypesMetadata"
  - "mcp__claude_ai_Atlassian_Rovo__getTransitionsForJiraIssue"
  - "mcp__claude_ai_Atlassian_Rovo__getIssueLinkTypes"
  - "mcp__claude_ai_Atlassian_Rovo__lookupJiraAccountId"
  - "mcp__claude_ai_Atlassian_Rovo__searchJiraIssuesUsingJql"
  # Write — the counterparts of the Linear Group B tools the same
  # Dev10x skills call (ticket-create, ticket-scope, investigate).
  - "mcp__claude_ai_Atlassian_Rovo__createJiraIssue"
  - "mcp__claude_ai_Atlassian_Rovo__editJiraIssue"
  - "mcp__claude_ai_Atlassian_Rovo__addCommentToJiraIssue"
  - "mcp__claude_ai_Atlassian_Rovo__addWorklogToJiraIssue"
  - "mcp__claude_ai_Atlassian_Rovo__createIssueLink"
  - "mcp__claude_ai_Atlassian_Rovo__transitionJiraIssue"

  # --- GitHub Issues (GH-768) ---
  # Mostly already covered by the unconditional `github-cli` group in
  # ../projects.yaml; this block adds only what a GitHub-tracker user
  # additionally needs and keeps the tracker map symmetrical (a `github`
  # selection must not fall through to Linear's block).
  github:
  - "mcp__plugin_dev10x_cli__issue_get"
  - "mcp__plugin_dev10x_cli__issue_list"
  - "mcp__plugin_dev10x_cli__issue_create"
  - "mcp__plugin_dev10x_cli__issue_edit"
  - "mcp__plugin_dev10x_cli__issue_close"
  - "mcp__plugin_dev10x_cli__issue_reopen"
  - "mcp__plugin_dev10x_cli__issue_comment"
  - "mcp__plugin_dev10x_cli__issue_comments"
