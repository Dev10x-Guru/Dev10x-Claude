  # --- Read-only cross-worktree git spellings (GH-1135, GH-1268) ---
  # GH-1472 settled the open question this block depended on (ADR-0021,
  # GH-925 F2): a mid-path `*` before `:*` is a literal character, so
  # all 27 rules that stood here (`git -C * <verb>:*` and both plumbing
  # orderings) never matched. They were dropped rather than rewritten to
  # the space form, where `*` would also match `-c core.fsmonitor=<cmd>`
  # and turn a read into arbitrary execution. A cross-worktree read
  # prompts, as it always did; prefer running from the target checkout.

  # --- Python project tooling (GH-20) ---
  - "Bash(uv run pytest:*)" # cli-friction: allow raw-pytest — base allow rule for plugin-maintenance, not a skill doc
  - "Bash(uv run --extra dev pytest:*)" # cli-friction: allow raw-pytest — base allow rule for plugin-maintenance, not a skill doc
  - "Bash(uv run ruff:*)"
  # GH-1248 added `uv run --directory * <tool>:*` forms here; GH-1472
  # dropped them — the `*` before `:*` is literal, so they never matched.
  # The DX007 prefix-friction validator already strips `--directory <p>`
  # and re-matches the inner command against the plain rules above.
  # GH-1189: `uv lock`, `uv sync`, `uv build`, `uv tool`, `uv pip *` and
  # `uv run *` were all catalogued; `uv add` was not, so a crew worker
  # adding a dependency prompted on an unattended night run while
  # `catalog-gap` reported 0 missing. `npm install *` is already a default
  # at the same trust level — both mutate a manifest and a lockfile in the
  # checkout, neither reaches outside it. `uv remove` is the symmetric
  # form; cataloguing only the additive half is how the next unattended
  # run finds the same wedge from the other direction.
  - "Bash(uv add:*)"
  - "Bash(uv remove:*)"
  # GH-1664: `npm ci` installs exactly what the committed lockfile pins
  # and refuses to touch the manifest, so it is narrower than `uv add`.
  # It prompted in a seeded session that had only `npm --version`.
  - "Bash(npm ci:*)"
  # GH-1149: the SANCTIONED lint form is bare `pre-commit run` — CLAUDE.md
  # says to call it directly, never via `uv run`. Only the discouraged
  # `uv run` shape was catalogued here, so the form users are told to use
  # prompted in every project. The rule exists in
  # src/dev10x/core/skills/permission/baseline-permissions.yaml (build-tools
  # tier), but that catalog is read by `permission resolve/audit/doctor`
  # and never by the ensure-base write path — a rule present only there
  # reaches no settings file. Global settings happened to carry it, which
  # masked the gap until GH-47 (project file wins) made global irrelevant.
  - "Bash(pre-commit run:*)"

  # --- SSH probes (GH-20) ---
  # Push/PR setup paths verify GitHub SSH access.
  - "Bash(ssh -T git@github.com)"

