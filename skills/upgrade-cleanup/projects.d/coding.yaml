# Permission-catalog fragment for the coding plugin (ADR-0034 Stage A3,
# GH-1589). Merged into ../projects.yaml by
# dev10x.core.skills.permission.catalog_paths: lists append after core's
# and the other plugins' in src/dev10x/core/plugins.yaml order. See the
# base file's header for the catalog itself.
#
# Owns the Dev10x MCP tools that only coding skills declare, every
# `Bash(gh …)` / `Bash(git …)` allow, the git aliases, the GitHub SSH
# probe, the test/lint/dependency runners and the foreman/watchdog CLI
# spellings. The safety floor (base_asks, base_denies) stays in core.

# GH-1317: the foreman/watchdog read-only verbs were absent in EVERY
# spelling, so an unattended pre-flight prompted on its own heartbeat
# and seventeen per-checkout catch-alls were accepted ad hoc to get
# past it. `skills/foreman/references/preflight-checklist.md` §1 names
# a fourth runner for these — the plugin-cache install invokes them
# through `--project $CLAUDE_PLUGIN_ROOT` (GH-961) — so that spelling
# is listed here and nowhere else.
command_spellings:
  - prefixes:
      ["", "uvx ", "uv run ", "uv run --project $CLAUDE_PLUGIN_ROOT "]
    commands:
      - dev10x foreman escalate  # GH-1582
      - dev10x foreman probe
      - dev10x foreman retire  # GH-1577
      - dev10x foreman watch
      - dev10x watchdog probe
      - dev10x watchdog sessions

