  - "mcp__plugin_dev10x_cli__pr_review_comment_edit"
  - "mcp__plugin_dev10x_cli__request_review"
  - "mcp__plugin_dev10x_cli__detect_base_branch"
  - "mcp__plugin_dev10x_cli__verify_pr_state"
  # GH-1680: gh-pr-create reads the pinned tracker before a Fixes line
  - "mcp__plugin_dev10x_cli__tracker_status"
  - "mcp__plugin_dev10x_cli__pre_pr_checks"
  - "mcp__plugin_dev10x_cli__create_pr"
  - "mcp__plugin_dev10x_cli__generate_commit_list"
  - "mcp__plugin_dev10x_cli__post_summary_comment"
  - "mcp__plugin_dev10x_cli__pr_notify"
  - "mcp__plugin_dev10x_cli__rebase_groom"
  - "mcp__plugin_dev10x_cli__create_worktree"
  - "mcp__plugin_dev10x_cli__mass_rewrite"
  - "mcp__plugin_dev10x_cli__start_split_rebase"
  - "mcp__plugin_dev10x_cli__next_worktree_name"
  - "mcp__plugin_dev10x_cli__setup_aliases"
  - "mcp__plugin_dev10x_cli__check_top_level_comments"
  - "mcp__plugin_dev10x_cli__unresolved_threads"
  - "mcp__plugin_dev10x_cli__ci_check_status"
  # Test runner (GH-880, #877 E3 gap 1) — the diag-friction steer target
  # for scoped py tests; `run_node_tests` stays in core.
  - "mcp__plugin_dev10x_cli__run_tests"
  - "mcp__plugin_dev10x_cli__collect_prs"
  # GH-1153: registered read-only, never catalogued until the coverage
  # test found it.
  - "mcp__plugin_dev10x_cli__background_preamble"
  # pr_labels defaults to action="list"; its add/remove writes are the
  # sanctioned path for the review:cleared signal (GH-1008) and are
  # idempotent, so skills call them unconditionally rather than probing.
  - "mcp__plugin_dev10x_cli__pr_labels"
  # Plugin-mandated workflow write (GH-1215): the raw milestone PATCH is
  # routed to the wrapper, so leaving it uncatalogued is a dead end.
  - "mcp__plugin_dev10x_cli__milestone_close"

