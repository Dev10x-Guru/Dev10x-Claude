# Skill family grouping for SKILLS.md index.
# Each family has a label, description, and ordered list of skill
# display-names (what users type). Hidden skills (hidden.yaml)
# are excluded before grouping.
#
# display_map translates display-names to internal invocation-name
# keys from SKILL.md. Skills not in display_map match by exact key.
#
# This file is the core fragment (ADR-0034 Stage A3, GH-1552, GH-1589).
# Each family lives whole in the fragment of the plugin that owns its
# skills: families.d/<plugin>.yaml, merged in by scripts/lib-families.sh
# core first, then in src/dev10x/core/plugins.yaml order — which is the
# order SKILLS.md lists the families in. Only Dev10x skills belong in a
# shipped family; add personal skills through a user families.yaml.

families:
  - label: Setup
    description: "Onboarding and playbooks"
    skills:
      - dev10x:onboarding
      - dev10x:playbook
      - dev10x:playbook-maintenance
