# Default acceptance criteria with executable checks
# Plugin-owned — updates propagate automatically to all projects.
# Repo overrides: ~/.config/Dev10x/dod-acceptance-criteria.yaml
#
# Schema per check:
#   name:             Human-readable criterion name (required)
#   check:            Shell command to run (use {pr_number}, {repo}, and
#                     {base_branch} placeholders — {base_branch} avoids a
#                     hardcoded develop so main-only repos work, GH-854 F2)
#                     Special values:
#                       "manual"  — ask the user via AskUserQuestion
#                       "prompt"  — Claude evaluates the prompt from session context
#   expect:           Exact expected output (trimmed)
#   expect_contains:  Output must contain this substring
#   expect_not_contains: Output must NOT contain this substring
#   expect_gt:        Output (parsed as number) must be greater than this value
#   prompt:           For "manual": question shown to user
#                     For "prompt": instruction Claude evaluates contextually
#   modes:            Per-mode overrides (optional). Map of mode name
#                     to {skip: true} to skip when that mode is active.
#                     Resolve active_modes from the DURABLE gate policy —
#                     global ~/.config/Dev10x/friction.yaml (projects[]
#                     match), falling back to legacy .claude/Dev10x/config.yaml.
#                     NOT the retired ephemeral .claude/Dev10x/session.yaml
#                     (ADR-0018, GH-854 F3).
#   requires_human_review:
#                     Optional boolean (ADR-0019, carried forward by
#                     ADR-0022 D-2). When true, skip this check if the
#                     durable review posture is `none` — no supervisor
#                     reads this project's PRs, so a review-shaped check
#                     is out of scope. Report it as
#                     "skipped (supervisor_review: none)". Resolve the
#                     posture via mcp__plugin_dev10x_cli__supervisor_review_status
#                     (absent or malformed reads as `required`), never by
#                     reading the durable YAML directly. This is a
#                     separate field, NOT a `modes:` entry — the posture
#                     is a project fact, not a mode name, and must not be
#                     smuggled into that map.
#   skip_when_merged: Optional boolean (GH-1665 F2/F4). When true and the
#                     PR state is MERGED, remove this check from scope and
#                     report it as "skipped (PR merged)" — not passed. A
#                     merged PR clears its review requests and may never
#                     re-run CI, so these checks can never settle there.
#                     Read the state via mcp__plugin_dev10x_cli__pr_get.
#
# Only one expect_* field per check. First match wins.

defaults:
  feature:
    checks:
      - name: Working copy clean
        check: git status --porcelain
        expect: ""
      - name: CI passing
        check: gh pr checks {pr_number} --repo {repo}  # cli-friction: allow raw-gh-pr — DoD runner executes this shell template directly
        expect_contains: "All checks were successful"
        skip_when_merged: true
      - name: PR not draft
        check: prompt
        prompt: >
          Call mcp__plugin_dev10x_cli__pr_get(number={pr_number},
          repo="{repo}") and read `isDraft`. PASS when it is false; FAIL
          otherwise. A mechanical read — never substitute a raw
          `gh pr view`, which the skill-redirect hook blocks (GH-1717).
      - name: No fixup commits
        check: git log --oneline origin/{base_branch}..HEAD
        expect_not_contains: "fixup!"
      - name: Skill routing compliance
        check: prompt
        prompt: >
          Review the session for skill routing violations: were all
          test runs delegated to the test skill (Python) or
          mcp__plugin_dev10x_cli__run_node_tests (JS/TS) — not raw
          pytest/uv run pytest/jest/vitest/yarn test? Were all
          commits created via dev10x:git-commit
          (not raw git commit)? Were all pushes via dev10x:git (not
          raw git push)? Check iterative loops especially — the first
          iteration often uses the skill but subsequent iterations
          fall back to raw CLI.
      - name: Fixes-linked issue scope delivered
        check: prompt
        prompt: >
          For each Fixes:/Closes: link on the PR, compare the linked
          issue's title and acceptance criteria against the diff (git
          diff origin/{base_branch}..HEAD). FAIL when a titled capability is
          unbuilt — tell-tales: new production code with no non-test
          caller, or a review comment / unchecked checklist item noting
          remaining work. A Fixes: link auto-closes its issue on merge
          regardless of disclosure, so this catches self-disclosed cuts
          too. On failure, recommend: drop or narrow the Fixes: link, or
          split the undelivered scope into a tracked follow-up issue
          before merge.
      - name: Deploy-time configuration in place
        check: prompt
        prompt: >
          Read the diff (git diff origin/{base_branch}..HEAD) for gates
          that only take effect at deploy time: a new or renamed
          environment variable, feature flag, secret, or config key the
          change reads. PASS when there are none. When there are, PASS
          only if the session shows the value is set in every
          environment the change ships to (a read-only listing, a
          linked config PR, or the supervisor's confirmation); FAIL
          otherwise, naming each unset key and environment. A merged
          PR whose gate is unset in production is invisible there, and
          every other check here would still pass (GH-1684 F1).
      - name: No unresolved review threads
        check: prompt
        prompt: >
          Call mcp__plugin_dev10x_cli__unresolved_threads(repo="{repo}",
          pr_number={pr_number}). PASS when the returned `count` is 0;
          FAIL otherwise, naming each unresolved thread's author and
          path. This is a mechanical read, not a judgement — do not
          reason about whether a thread "looks addressed": an
          unresolved thread is a failure.
        requires_human_review: true
        modes:
          review-deferred:
            skip: true
      - name: Review requested
        check: prompt
        prompt: >
          Call mcp__plugin_dev10x_cli__pr_get(number={pr_number},
          repo="{repo}") and read `reviewRequests`. PASS when it holds at
          least one reviewer; FAIL when it is empty or absent. Never
          substitute a raw `gh pr view` (GH-1717).
        requires_human_review: true
        skip_when_merged: true
        modes:
          solo-maintainer:
            skip: true
          review-deferred:
            skip: true

