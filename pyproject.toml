[project]
name = "Dev10x"
version = "0.93.0"
description = "Claude Code plugin providing reusable skills, hooks, and commands"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
authors = [{ name = "Janusz Skonieczny" }]
keywords = ["claude", "claude-code", "plugin", "ai", "developer-tools"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development",
    "Topic :: Software Development :: Build Tools",
]
dependencies = [
    "click>=8.0,<9",
    "msgpack>=1.0,<2",
    "pyjwt[crypto]>=2.8,<3",
    "pyyaml>=6.0,<7",
    # GH-483: `dev10x skill notify slack-send` imports slack_sdk in-process
    # (src/dev10x/skills/notifications/slack_notify.py). It must be a base
    # dependency so the uvx-distributed env can send Slack notifications —
    # `uvx dev10x` installs base deps only, not optional extras.
    "slack-sdk>=3.21,<4",
]

[project.urls]
Homepage = "https://dev10x.guru"
Repository = "https://github.com/Dev10x-Guru/dev10x-claude"
Issues = "https://github.com/Dev10x-Guru/dev10x-claude/issues"
Changelog = "https://github.com/Dev10x-Guru/dev10x-claude/blob/main/CHANGELOG.md"

[project.scripts]
dev10x = "dev10x.cli:cli"

[project.optional-dependencies]
dev = [
    "factory-boy>=3.3,<4",
    "faker>=33.0,<34",
    "pytest>=8.0,<9",
    "pytest-asyncio>=0.24,<0.25",
    "pytest-benchmark>=5.0,<6",
    "pytest-cov>=6.0,<7",
    "mcp>=1.0,<2",
    "ruff>=0.9,<1",
    "mypy>=1.13,<2",
    "pre-commit>=4.0,<5",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"dev10x" = ["**/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src/dev10x --cov-report=term-missing"

[tool.coverage.run]
source = ["src/dev10x"]

[tool.coverage.report]
fail_under = 75
show_missing = true
exclude_lines = ["if __name__", "pragma: no cover"]

[tool.ruff]
line-length = 99
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest_benchmark]
# Store baselines in .benchmarks/ (gitignored per-run, cached by CI)
storage = "file"
# Fail on mean regression > 20% vs stored baseline
compare_fail = ["mean:20%"]
# Minimum rounds so outliers don't skew results
min_rounds = 5
timer = "perf_counter"
disable_gc = true

[tool.mypy]
mypy_path = "src"
