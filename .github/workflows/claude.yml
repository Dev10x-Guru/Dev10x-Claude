name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref || github.event.issue.pull_request && format('refs/pull/{0}/head', github.event.issue.number) || github.ref }}

      # GH-1615: pinned CLI from CLAUDE_CLI_VERSION; see claude-code-review.yml.
      - name: Install Claude Code CLI
        id: claude-cli
        working-directory: ${{ runner.temp }}
        env:
          CLAUDE_CLI_VERSION: ${{ vars.CLAUDE_CLI_VERSION }}
        run: |
          set -euo pipefail
          npm install --global "@anthropic-ai/claude-code@${CLAUDE_CLI_VERSION:?set the CLAUDE_CLI_VERSION repository variable}"
          cli_path=$(command -v claude)
          "$cli_path" --version
          echo "path=$cli_path" >> "$GITHUB_OUTPUT"

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@a26b07d8c778b0c43f64618e5fd29fd0f8af72e8 # v1.0.250
        env:
          COMMENT_BODY: ${{ github.event.comment.body || github.event.review.body || '' }}
          PR_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number || '' }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          path_to_claude_code_executable: ${{ steps.claude-cli.outputs.path }}
          additional_permissions: |
            actions: read
          # GH-1615: guidelines first, the request and per-run values last,
          # so the static part is a prefix every run reads from the cache.
          # The request used to open the prompt, which made every run write
          # the whole prompt again.
          prompt: |
            GUIDELINES:

            Read these files for context:
            1. CLAUDE.md - Repository conventions and patterns
            2. .claude/rules/INDEX.md - Agent routing table
            3. references/review-checks-common.md - False positive prevention

            FOR PR REVIEWS:
            - Focus ONLY on changes in the PR, not the entire codebase
            - No PR context bundle is fetched for this job. Use
              `gh pr diff <PR>` to see actual changes
            - Use `gh pr view <PR> --json files` to get changed files list
            - Load domain-specific agent specs from .claude/agents/ based on
              changed file types (see CLAUDE.md Code Review table)
            - Follow review workflow from references/review-guidelines.md

            FOR COMMITS AND PR CREATION:
            Follow outcome-focused (JTBD) principles from `references/git-jtbd.md`:
            - Shift from implementation details ("Add X") to user outcomes ("Enable Y")
            - Extract ticket ID from branch name (format: username/TICKET-ID/[worktree/]description)
            - Use appropriate gitmoji (see `references/git-commits.md`)

            CODE VERIFICATION:
            Before claiming code contains an error:
            - Read the actual code file — never rely on diff snippets alone
            - For multi-commit PRs, verify the issue still exists in the latest commit
            - Quote exact code when making claims about errors

            Be brief but thorough. Be constructive and helpful.

            ---
            REQUEST:
            ${{ github.event.comment.body || github.event.review.body || github.event.issue.body || github.event.issue.title }}

            RUN CONTEXT:
            - REPO: ${{ github.repository }}
            - PR: ${{ github.event.issue.number || github.event.pull_request.number }}

          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # GH-1615: the first four flags are the shared CI prefix (see
          # claude-code-review.yml). No mcp__github__* tool: any one starts
          # the GitHub MCP server and puts all of its tool schemas into the
          # prefix; review comments are a `gh api` call away. --tools leaves
          # only the built-in tools this job uses; Write is how a multi-line
          # review body reaches `gh pr review --body-file`.
          claude_args: '--settings .github/claude-ci-settings.json --append-system-prompt-file .github/claude/ci-system-prompt.md --exclude-dynamic-system-prompt-sections --disallowed-tools "ScheduleWakeup,Monitor" --model haiku --tools "Bash,Read,Write,Grep,Glob" --allowed-tools "Read,Write,Grep,Glob,mcp__github_inline_comment__create_inline_comment,Bash(gh issue view:*),Bash(gh search:*),Bash(gh issue list:*),Bash(gh pr review:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*),Bash(gh api:*)"'

      # GH-1615: cost and cache use of this run; see claude-code-review.yml.
      - name: Report Claude usage
        if: ${{ always() && steps.claude.outputs.execution_file != '' }}
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          jq -r '[.[] | select(.type == "result")] | last
            | "### Claude usage\n\n| Model | Input | Cache write | Cache read | Output | Cost (USD) |\n|---|---:|---:|---:|---:|---:|\n"
              + ((.modelUsage // {}) | to_entries | map("| \(.key) | \(.value.inputTokens // 0) | \(.value.cacheCreationInputTokens // 0) | \(.value.cacheReadInputTokens // 0) | \(.value.outputTokens // 0) | \(.value.costUSD // 0 | . * 10000 | round / 10000) |") | join("\n"))
              + "\n\n**Total:** $\(.total_cost_usd // 0 | . * 100 | round / 100) · \(.num_turns // 0) turns · \((.permission_denials // []) | length) permission denials\n"' \
            "$EXECUTION_FILE" >> "$GITHUB_STEP_SUMMARY" || echo "::warning::Could not read usage from $EXECUTION_FILE"
          jq -r '[.[] | select(.type == "result")] | last | [(.modelUsage // {})[]] as $m
            | "::notice title=Claude usage::$\(.total_cost_usd // 0) · \(.num_turns // 0) turns · cache read \($m | map(.cacheReadInputTokens // 0) | add // 0) · cache write \($m | map(.cacheCreationInputTokens // 0) | add // 0) · uncached input \($m | map(.inputTokens // 0) | add // 0)"' \
            "$EXECUTION_FILE" || true
