name: Claude Code Review

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    types: [opened, ready_for_review, synchronize]
    paths:
      - "**/*.py"
      - "**/*.sh"
      - "**/*.yaml"
      - "**/*.yml"
      - "**/Makefile"
      - "skills/**/SKILL.md"
      - "CLAUDE.md"
      - ".claude/rules/**/*.md"
      - "references/**/*.md"
      - ".claude/agents/**/*.md"
      - ".github/claude/**"
      - ".github/claude-ci-settings.json"
      - "!.github/workflows/claude*.yml"

jobs:
  claude-review:
    # GH-1226: GitHub refuses OIDC minting for a pull_request run from a
    # fork, so claude-code-action cannot authenticate and this job fails
    # at token minting every time — reporting a red check that says
    # `id-token: write` is missing when it is declared right below. Skip
    # instead, so a fork PR reads as not-reviewed rather than broken.
    # Both checks are non-required, so nothing that gated a merge is
    # lost. Getting actual review coverage on fork PRs needs a
    # workflow_run split or pull_request_target, neither of which is a
    # trigger swap — see the issue.
    if: >-
      !github.event.pull_request.draft
      && !github.event.pull_request.head.repo.fork

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Skip if duplicate SHA run exists
        id: dedup
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PEER_RUN=$(gh api \
            "repos/${{ github.repository }}/actions/runs?head_sha=${{ github.sha }}&per_page=10" \
            --jq "[.workflow_runs[] | select(.name == \"${{ github.workflow }}\" and .id != ${{ github.run_id }} and .conclusion != \"cancelled\" and .conclusion != \"skipped\" and .status != \"queued\")] | first | .id // empty" \
            2>/dev/null || true)
          if [ -n "$PEER_RUN" ]; then
            echo "::notice::Skipping duplicate run — SHA ${{ github.sha }} already handled by run $PEER_RUN"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip if PR already merged or closed
        if: steps.dedup.outputs.skip != 'true'
        id: pr-state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          STATE=$(gh pr view ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} --json state -q '.state')
          if [ "$STATE" != "OPEN" ]; then
            echo "::notice::Skipping — PR #${{ github.event.pull_request.number }} is $STATE"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        if: steps.dedup.outputs.skip != 'true' && steps.pr-state.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # GH-1585: the context script runs with this job's token, so it is
      # taken from the base branch (or the default branch), never from the
      # PR checkout. Until it exists on one of them the review is skipped
      # with a notice rather than running the PR's own copy.
      - name: Stage scripts from the trusted ref
        if: steps.dedup.outputs.skip != 'true' && steps.pr-state.outputs.skip != 'true'
        id: stage
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          dir=.github/scripts/claude-pr-context
          ref=""
          for branch in "$BASE_REF" "$DEFAULT_BRANCH"; do
            git fetch --no-tags --depth=1 origin "$branch"
            if git cat-file -e "FETCH_HEAD:$dir" 2>/dev/null; then
              ref=$(git rev-parse FETCH_HEAD)
              break
            fi
          done
          if [[ -z "$ref" ]]; then
            echo "::notice::Neither $BASE_REF nor $DEFAULT_BRANCH has $dir yet — skipping rather than running this PR's own copy."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/scripts"
          git archive "$ref" "$dir" | tar -x -C "$RUNNER_TEMP/scripts" --strip-components=3

      # GH-1585: one fetch of metadata, commits, per-file patches, comments,
      # reviews and threads, so the reviewer reads files instead of paying
      # a full-context turn for every `gh` call.
      - name: Gather PR context
        if: steps.dedup.outputs.skip != 'true' && steps.pr-state.outputs.skip != 'true' && steps.stage.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: '"$RUNNER_TEMP/scripts/gather-pr-context.sh"'

      # GH-1615: the CLI decides which model each alias (`sonnet`, `haiku`)
      # names, and the one bundled with the action lags a generation. One
      # repository variable, CLAUDE_CLI_VERSION, sets the CLI for every
      # Claude workflow, so the aliases resolve to the same models
      # everywhere and move with a variable change, not an action bump.
      # `path_to_claude_code_executable` below skips the action's own
      # install. An empty variable fails this step instead of installing
      # `latest`. npm runs from RUNNER_TEMP because the PR checkout is
      # untrusted: a .npmrc in the PR could otherwise redirect the registry.
      - name: Install Claude Code CLI
        if: steps.dedup.outputs.skip != 'true' && steps.pr-state.outputs.skip != 'true' && steps.stage.outputs.skip != 'true'
        id: claude-cli
        working-directory: ${{ runner.temp }}
        env:
          CLAUDE_CLI_VERSION: ${{ vars.CLAUDE_CLI_VERSION }}
        run: |
          set -euo pipefail
          npm install --global "@anthropic-ai/claude-code@${CLAUDE_CLI_VERSION:?set the CLAUDE_CLI_VERSION repository variable}"
          cli_path=$(command -v claude)
          "$cli_path" --version
          echo "path=$cli_path" >> "$GITHUB_OUTPUT"

      - name: Run Claude Code Review
        if: steps.dedup.outputs.skip != 'true' && steps.pr-state.outputs.skip != 'true' && steps.stage.outputs.skip != 'true'
        id: claude-review
        uses: anthropics/claude-code-action@a26b07d8c778b0c43f64618e5fd29fd0f8af72e8 # v1.0.250
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          path_to_claude_code_executable: ${{ steps.claude-cli.outputs.path }}
          # GH-1585: static instructions first, per-run values last in
          # RUN CONTEXT. The API caches the prompt up to the first byte
          # that differs, so a PR number on line 1 made every run write
          # the whole prompt again instead of reading it.
          prompt: |
            You are performing an automated code review using a multi-agent
            architecture. Be brief but thorough.

            PR CONTEXT — a step before you fetched this PR into
            `.claude-ci/pr-context/`: metadata, commits, the changed-file
            list, one patch per file, comments, reviews and review threads.
            Use these files instead of `gh` for anything they cover.

            STEP 1 — LOAD CORE RULES:
            Read these files first:
            - .claude-ci/pr-context/INDEX.md (this PR: summary, files, patches)
            - references/review-guidelines.md (workflow, threads, summaries)
            - references/review-checks-common.md (false positive prevention)
            - CLAUDE.md (project conventions)

            STEP 2 — CLASSIFY PR TYPE:
            Check the PR title and description in `pr.json` for:
            - POC/test code (🧪, "POC", "demo", "prototype") → relaxed standards
            - Revert PR ("Revert" in title) → REQUEST_CHANGES, require explanation
            - Stacked PR ("Stacked on #N", "Depends on #N") → note in summary,
              focus review on changes unique to THIS PR, not the base PR

            PR metadata (title, body, commits) is checked by claude-pr-hygiene.yml.
            Do NOT provide feedback on those items.

            STEP 3 — DOMAIN-ROUTED REVIEW (delegate to haiku subagents):
            Classify the changed files listed in
            `.claude-ci/pr-context/files.txt`. Never fetch the whole diff
            with `gh pr diff`. To see what changed in one file, Read
            `.claude-ci/pr-context/patches/<path>.patch`, and Read the file
            at HEAD for context. When INDEX.md shows no patch for a file,
            review that file from HEAD with Read instead. For EACH affected
            domain, dispatch ONE subagent via the Task tool using the
            registered agent name below (the .claude/agents/ specs carry
            `model: haiku` frontmatter, so the per-rule review work runs on
            the cheap tier while you — the orchestrator — only route,
            deduplicate, verify, and post):

            - Skills (skills/**) → reviewer-skill AND reviewer-skill-behavior
            - Infrastructure (Makefile, **/*.sh, bin/**, hooks/**,
              .github/workflows/**) → reviewer-infra
            - Documentation (docs/**/*.md, .claude/**/*.md, CLAUDE.md,
              README.md) → reviewer-docs
            - Rules/agents (.claude/rules/**, .claude/agents/**,
              agents/**, references/**) → reviewer-rules-maintenance
            - Python/shell code (**/*.py, **/*.sh, not covered above)
              → reviewer-generic

            Dispatch all matched subagents in ONE message so they run in
            parallel. They run in the foreground and each Task call returns
            the subagent's full report in that same message — never end
            your turn to wait for results. Each subagent prompt MUST include:
            1. The list of changed files for its domain and the PR number
               (the agent reads actual files at HEAD; it must not rely on
               diff snippets alone)
            2. Its Required Reading rule files (the agent spec lists them)
            3. This coverage-first instruction, verbatim: "Report every
               issue you find, including ones you are uncertain about or
               consider low-severity. Do not filter for importance or
               confidence — the orchestrator verifies and ranks findings.
               For each finding include file:line, severity (CRITICAL /
               WARNING / INFO), confidence, and a one-sentence rationale."
            4. "Each changed file's diff is at
               .claude-ci/pr-context/patches/<path>.patch; a file with no
               patch there is too large or binary, so Read it at HEAD."

            Only dispatch agents for domains with changed files. When a
            domain has more than ~15 changed files, split it across two
            subagents by directory.

            When the subagents return, YOU (the orchestrator) must:
            1. Deduplicate findings that multiple agents raised on the
               same file:line
            2. Check every finding against
               references/review-checks-common.md and drop false-positive
               matches (note the dropped count in the summary)
            3. Filter by confidence and severity — post CRITICAL/WARNING
               findings; include INFO only when clearly actionable
            4. Verify surviving findings against actual code (Read the
               file at the cited line) before posting

            STEP 4 — CROSS-CUTTING CHECKS:
            Apply to ALL files regardless of domain:
            - Dead code detection (Grep for imports of new classes/functions)
            - Parameter change analysis (Grep ALL call sites, not just diff)
            - Code verification (read actual file before claiming errors)
            - Scope awareness (only review changed lines; pre-existing issues
              are "out of scope")

            STEP 5 — PRODUCE REVIEW OUTPUT:
            Follow the review workflow from review-guidelines.md:
            - Check existing review comments to avoid duplicates
              (`.claude-ci/pr-context/review-comments.json` and
              `review-threads.json`)
            - Before writing a summary, search previous summaries
              (`.claude-ci/pr-context/reviews.json` and
              `issue-comments.json`) to determine the correct round number
              (highest existing round + 1)
            - Use inline comments for specific issues
            - Create ONE summary per review cycle: Write it with the Write
              tool to `review-summary-body.md` in the current directory,
              then run `gh pr review <PR> --comment --body-file review-summary-body.md`
            - Positive validation when PR has no issues
            - After author pushes fixes: acknowledge, focus on new issues only

            Be constructive and helpful in your feedback.

            STEP 6 — HIDE OBSOLETE REVIEW SUMMARIES:
            Before posting the new summary, minimize previous Claude review
            summaries where ALL associated review threads are resolved.
            `.claude-ci/pr-context/review-threads.json` gives each thread's
            `is_resolved` and the `review_id` of its comments, and
            `reviews.json` gives each review's `node_id`. Hide a
            fully-resolved summary with the `minimizeComment` mutation via
            `gh api graphql`. Leave reviews with any unresolved threads
            visible.

            STEP 7 — CONVERT TO DRAFT IF ISSUES FOUND:
            After completing the review, check the real inline-comment count
            from the GitHub API — do NOT rely on your own recollection of
            whether you called create_inline_comment, and do NOT use the
            pre-fetched files, which predate this run:
              `gh api repos/<REPO>/pulls/<PR>/comments --jq length`
            If the returned count is greater than 0, convert the PR to draft:
              `gh pr ready --undo <PR>`
            This lets the author fix all issues without triggering re-reviews
            on each fixup push. The author marks "Ready for review" when done.
            If the count is 0 (no inline comments), do NOT convert to draft.

            RUN CONTEXT:
            - REPO: ${{ github.repository }}
            - PR: ${{ github.event.pull_request.number }}

          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # Cost shape: the sonnet orchestrator handles routing, dedup,
          # verification, and posting (a small share of tokens); the bulk
          # per-domain rule review runs on haiku subagents dispatched from
          # .claude/agents/ frontmatter (the cheap tier). Task is required
          # for subagent dispatch.
          #
          # GH-1585: the first four flags are identical, in the same order,
          # in every Claude review workflow, so the system prompt is
          # byte-stable and served from the prompt cache. No mcp__github__*
          # tool is allowed: any one starts the GitHub MCP server and puts
          # all of its tool schemas into the prefix. Unlike the hygiene
          # check, this step passes no --tools: it needs Bash and the
          # subagent tool, whose name differs across CLI versions, and a
          # list that misses it silently disables STEP 3. See
          # .claude/rules/claude-ci-cost.md.
          claude_args: '--settings .github/claude-ci-settings.json --append-system-prompt-file .github/claude/ci-system-prompt.md --exclude-dynamic-system-prompt-sections --disallowed-tools "ScheduleWakeup,Monitor" --model sonnet --allowed-tools "Task,Read,Write,Grep,Glob,mcp__github_inline_comment__create_inline_comment,Bash(gh issue view:*),Bash(gh search:*),Bash(gh issue list:*),Bash(gh pr review:*),Bash(gh pr view:*),Bash(gh pr list:*),Bash(gh pr ready:*),Bash(gh api:*)"'

      # GH-1585: cost, turns and cache use of this run in the job summary
      # and as a notice, so a prompt or model change can be compared before
      # and after. A healthy run reads far more cache than it writes.
      - name: Report Claude usage
        if: ${{ always() && steps.claude-review.outputs.execution_file != '' }}
        env:
          EXECUTION_FILE: ${{ steps.claude-review.outputs.execution_file }}
        run: |
          jq -r '[.[] | select(.type == "result")] | last
            | "### Claude usage\n\n| Model | Input | Cache write | Cache read | Output | Cost (USD) |\n|---|---:|---:|---:|---:|---:|\n"
              + ((.modelUsage // {}) | to_entries | map("| \(.key) | \(.value.inputTokens // 0) | \(.value.cacheCreationInputTokens // 0) | \(.value.cacheReadInputTokens // 0) | \(.value.outputTokens // 0) | \(.value.costUSD // 0 | . * 10000 | round / 10000) |") | join("\n"))
              + "\n\n**Total:** $\(.total_cost_usd // 0 | . * 100 | round / 100) · \(.num_turns // 0) turns · \((.permission_denials // []) | length) permission denials\n"' \
            "$EXECUTION_FILE" >> "$GITHUB_STEP_SUMMARY" || echo "::warning::Could not read usage from $EXECUTION_FILE"
          jq -r '[.[] | select(.type == "result")] | last | [(.modelUsage // {})[]] as $m
            | "::notice title=Claude usage::$\(.total_cost_usd // 0) · \(.num_turns // 0) turns · cache read \($m | map(.cacheReadInputTokens // 0) | add // 0) · cache write \($m | map(.cacheCreationInputTokens // 0) | add // 0) · uncached input \($m | map(.inputTokens // 0) | add // 0)"' \
            "$EXECUTION_FILE" || true
