name: Claude Code Review

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    types: [opened, ready_for_review, synchronize]
    paths:
      - "**/*.py"
      - "**/*.sh"
      - "**/*.yaml"
      - "**/*.yml"
      - "**/Makefile"
      - "skills/**/SKILL.md"
      - "CLAUDE.md"
      - ".claude/rules/**/*.md"
      - "references/**/*.md"
      - ".claude/agents/**/*.md"
      - ".github/claude/**"
      - ".github/claude-ci-settings.json"
      - "!.github/workflows/claude*.yml"

jobs:
  claude-review:
    # GH-1226: GitHub refuses OIDC minting for a pull_request run from a
    # fork, so claude-code-action cannot authenticate and this job fails
    # at token minting every time — reporting a red check that says
    # `id-token: write` is missing when it is declared right below. Skip
    # instead, so a fork PR reads as not-reviewed rather than broken.
    # Both checks are non-required, so nothing that gated a merge is
    # lost. Getting actual review coverage on fork PRs needs a
    # workflow_run split or pull_request_target, neither of which is a
    # trigger swap — see the issue.
    if: >-
      !github.event.pull_request.draft
      && !github.event.pull_request.head.repo.fork

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Skip if duplicate SHA run exists
        id: dedup
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PEER_RUN=$(gh api \
            "repos/${{ github.repository }}/actions/runs?head_sha=${{ github.sha }}&per_page=10" \
            --jq "[.workflow_runs[] | select(.name == \"${{ github.workflow }}\" and .id != ${{ github.run_id }} and .conclusion != \"cancelled\" and .conclusion != \"skipped\" and .status != \"queued\")] | first | .id // empty" \
            2>/dev/null || true)
          if [ -n "$PEER_RUN" ]; then
            echo "::notice::Skipping duplicate run — SHA ${{ github.sha }} already handled by run $PEER_RUN"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip if PR already merged or closed
        if: steps.dedup.outputs.skip != 'true'
        id: pr-state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          STATE=$(gh pr view ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} --json state -q '.state')
          if [ "$STATE" != "OPEN" ]; then
            echo "::notice::Skipping — PR #${{ github.event.pull_request.number }} is $STATE"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        if: steps.dedup.outputs.skip != 'true' && steps.pr-state.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          # GH-1625: the model can Read the checkout; no step here pushes.
          persist-credentials: false

      # GH-1585: the context script runs with this job's token, so it is
      # taken from the base branch (or the default branch), never from the
      # PR checkout. Until it exists on one of them the review is skipped
      # with a notice rather than running the PR's own copy.
      # GH-1625: the prompt, claude_args, shared system prompt and CI
      # settings come from the same ref, copied over the checkout, so a PR
      # cannot rewrite the instructions its own review runs under.
      - name: Stage scripts from the trusted ref
        if: steps.dedup.outputs.skip != 'true' && steps.pr-state.outputs.skip != 'true'
        id: stage
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          dir=.github/scripts/claude-pr-context
          ref=""
          for branch in "$BASE_REF" "$DEFAULT_BRANCH"; do
            git fetch --no-tags --depth=1 origin "$branch"
            if git cat-file -e "FETCH_HEAD:$dir/build-claude-inputs.sh" 2>/dev/null; then
              ref=$(git rev-parse FETCH_HEAD)
              break
            fi
          done
          if [[ -z "$ref" ]]; then
            echo "::notice::Neither $BASE_REF nor $DEFAULT_BRANCH has $dir/build-claude-inputs.sh yet — skipping rather than running this PR's own copy."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/scripts"
          git archive "$ref" "$dir" | tar -x -C "$RUNNER_TEMP/scripts" --strip-components=3
          "$RUNNER_TEMP/scripts/stage-trusted.sh" "$ref" --keep-pr-head

      # GH-1585: one fetch of metadata, commits, per-file patches, comments,
      # reviews and threads, so the reviewer reads files instead of paying
      # a full-context turn for every `gh` call.
      - name: Gather PR context
        if: steps.dedup.outputs.skip != 'true' && steps.pr-state.outputs.skip != 'true' && steps.stage.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: '"$RUNNER_TEMP/scripts/gather-pr-context.sh"'

      # GH-1625: static prompt files first, per-run values last in RUN
      # CONTEXT. The API caches the prompt up to the first byte that
      # differs, so the files must never hold a ${{ }} value.
      - name: Build Claude inputs
        if: steps.dedup.outputs.skip != 'true' && steps.pr-state.outputs.skip != 'true' && steps.stage.outputs.skip != 'true'
        id: inputs
        env:
          RUN_CONTEXT: |
            - REPO: ${{ github.repository }}
            - PR: ${{ github.event.pull_request.number }}
        run: >-
          "$RUNNER_TEMP/scripts/build-claude-inputs.sh" args/code-review.txt
          prompts/code-review.core.md prompts/code-review.output-ci.md

      # GH-1622: the probe-comment cleanup below only deletes comments
      # made after this point, so it never touches an earlier review's.
      - name: Record review start
        if: steps.dedup.outputs.skip != 'true' && steps.pr-state.outputs.skip != 'true' && steps.stage.outputs.skip != 'true'
        id: review-start
        run: echo "iso=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      # GH-1615: the CLI decides which model each alias (`sonnet`, `haiku`)
      # names, and the one bundled with the action lags a generation. One
      # repository variable, CLAUDE_CLI_VERSION, sets the CLI for every
      # Claude workflow, so the aliases resolve to the same models
      # everywhere and move with a variable change, not an action bump.
      # `path_to_claude_code_executable` below skips the action's own
      # install. An empty variable fails this step instead of installing
      # `latest`. npm runs from RUNNER_TEMP because the PR checkout is
      # untrusted: a .npmrc in the PR could otherwise redirect the registry.
      - name: Install Claude Code CLI
        if: steps.dedup.outputs.skip != 'true' && steps.pr-state.outputs.skip != 'true' && steps.stage.outputs.skip != 'true'
        id: claude-cli
        working-directory: ${{ runner.temp }}
        env:
          CLAUDE_CLI_VERSION: ${{ vars.CLAUDE_CLI_VERSION }}
        run: |
          set -euo pipefail
          npm install --global "@anthropic-ai/claude-code@${CLAUDE_CLI_VERSION:?set the CLAUDE_CLI_VERSION repository variable}"
          cli_path=$(command -v claude)
          "$cli_path" --version
          echo "path=$cli_path" >> "$GITHUB_OUTPUT"

      - name: Run Claude Code Review
        if: steps.dedup.outputs.skip != 'true' && steps.pr-state.outputs.skip != 'true' && steps.stage.outputs.skip != 'true'
        id: claude-review
        uses: anthropics/claude-code-action@a26b07d8c778b0c43f64618e5fd29fd0f8af72e8 # v1.0.250
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        with:
          # GH-1622: workload identity federation — the job's OIDC token
          # (hence `id-token: write`) is exchanged for a short-lived token
          # acting as the Dev10x service account. These are identifiers,
          # not credentials. Never set anthropic_api_key beside them: a key
          # outranks federation (claude-ci-cost.md rule 9). The action's
          # post-step that drops probe inline comments ("Testing if I can
          # comment…") calls the API with the static key only and fails
          # open without one, so the classifier is off and the "Delete
          # probe inline comments" step removes probes with the GitHub
          # token. A stray probe matters here: the draft-conversion step
          # drafts the PR on any inline comment left in place. Turn
          # classification back on if the post-step learns to use the
          # federated token.
          anthropic_federation_rule_id: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          anthropic_organization_id: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          anthropic_service_account_id: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          anthropic_workspace_id: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
          classify_inline_comments: "false"
          path_to_claude_code_executable: ${{ steps.claude-cli.outputs.path }}
          # GH-1625: the prompt and claude_args are built from
          # .github/claude/prompts/code-review.*.md and
          # .github/claude/args/code-review.txt, staged from the base ref.
          # Edit those files, not this step. The action only runs its agent
          # mode on a non-empty prompt input, so the prompt cannot be a file
          # path here.
          #
          # Cost shape: the sonnet orchestrator handles routing, dedup,
          # verification, and posting (a small share of tokens); the bulk
          # per-domain rule review runs on subagents dispatched from
          # .claude/agents/ frontmatter. Task is required for subagent
          # dispatch, so the args file passes no --tools: the subagent
          # tool's name differs across CLI versions, and a list that misses
          # it silently disables STEP 3. No mcp__github__* tool is allowed.
          # See .claude/rules/claude-ci-cost.md.
          prompt: ${{ steps.inputs.outputs.prompt }}
          claude_args: ${{ steps.inputs.outputs.claude_args }}

      # GH-1622: stands in for the action's probe classifier, which needs
      # the static key (see the federation comment above). Deletes
      # claude[bot] inline comments from this run whose whole body is a
      # tool test ("Test comment", "Can I post here?"); a real finding that
      # merely opens like one never matches. Every deletion is logged.
      # Ported from tt-pos b54b48b30.
      - name: Delete probe inline comments
        if: ${{ always() && steps.claude-review.outputs.conclusion != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SINCE: ${{ steps.review-start.outputs.iso }}
        run: |
          # Without pipefail a failed listing would empty the loop and pass.
          set -o pipefail
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/comments?since=${SINCE}" \
            | jq -r --arg since "$SINCE" '.[][]
                | select(.user.login == "claude[bot]" and .created_at >= $since)
                | select((.body | length) < 100 and (.body | contains("**") | not))
                | select(.body | test("^\\s*(test( comment)?|testing( (if|whether) (i can( comment| post)?( here| on this line)?|this works|the (inline )?comment( tool)?( works)?))?|this is a test( comment)?|can i (post|comment)( here)?|does this work|checking (if|whether) (i can|this works|the (inline )?comment( tool)? works))[.!?]?\\s*$"; "i"))
                | .id' \
            | while read -r id; do
                if gh api -X DELETE "repos/${GITHUB_REPOSITORY}/pulls/comments/${id}"; then
                  echo "::warning title=Deleted probe inline comment::Removed claude[bot] probe comment ${id} on PR #${PR_NUMBER}."
                else
                  echo "::error title=Probe inline comment left in place::Could not delete claude[bot] comment ${id}; it still counts as a review finding."
                fi
              done

      # GH-1618: an inline comment is a blocking finding, so the PR goes
      # back to draft and the author's fixup pushes do not each re-trigger
      # a review; marking it ready again starts the next one. This used to
      # be a prompt step the model ran itself, and it never fired: it
      # counted with a field `gh pr view` does not have, and the action's
      # classifier held comments back until after the session. Counting
      # here, after the probe cleanup and with the job token, sees exactly
      # the comments this run left.
      - name: Convert to draft when the review left findings
        if: ${{ steps.claude-review.outputs.conclusion == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SINCE: ${{ steps.review-start.outputs.iso }}
        run: |
          set -euo pipefail
          # Root comments only: a reply acknowledging a fix is not a finding.
          count=$(gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/comments?since=${SINCE}" \
            | jq --arg since "$SINCE" '[.[][] | select(.user.login == "claude[bot]"
                and .created_at >= $since and .in_reply_to_id == null)] | length')
          if [[ "$count" -gt 0 ]]; then
            gh pr ready "$PR_NUMBER" --undo --repo "$GITHUB_REPOSITORY"
            echo "::notice title=PR converted to draft::The review left ${count} inline finding(s); mark the PR ready for review when they are addressed."
          else
            echo "The review left no inline findings; the PR stays ready for review."
          fi

      # GH-1585: cost, turns and cache use of this run in the job summary
      # and as a notice, so a prompt or model change can be compared before
      # and after. A healthy run reads far more cache than it writes.
      - name: Report Claude usage
        if: ${{ always() && steps.claude-review.outputs.execution_file != '' }}
        env:
          EXECUTION_FILE: ${{ steps.claude-review.outputs.execution_file }}
        run: |
          jq -r '[.[] | select(.type == "result")] | last
            | "### Claude usage\n\n| Model | Input | Cache write | Cache read | Output | Cost (USD) |\n|---|---:|---:|---:|---:|---:|\n"
              + ((.modelUsage // {}) | to_entries | map("| \(.key) | \(.value.inputTokens // 0) | \(.value.cacheCreationInputTokens // 0) | \(.value.cacheReadInputTokens // 0) | \(.value.outputTokens // 0) | \(.value.costUSD // 0 | . * 10000 | round / 10000) |") | join("\n"))
              + "\n\n**Total:** $\(.total_cost_usd // 0 | . * 100 | round / 100) · \(.num_turns // 0) turns · \((.permission_denials // []) | length) permission denials\n"' \
            "$EXECUTION_FILE" >> "$GITHUB_STEP_SUMMARY" || echo "::warning::Could not read usage from $EXECUTION_FILE"
          jq -r '[.[] | select(.type == "result")] | last | [(.modelUsage // {})[]] as $m
            | "::notice title=Claude usage::$\(.total_cost_usd // 0) · \(.num_turns // 0) turns · cache read \($m | map(.cacheReadInputTokens // 0) | add // 0) · cache write \($m | map(.cacheCreationInputTokens // 0) | add // 0) · uncached input \($m | map(.inputTokens // 0) | add // 0)"' \
            "$EXECUTION_FILE" || true

      # GH-1691: the action exits 0 without setting `conclusion` when it
      # never starts the review — most often because this workflow file
      # differs from the default branch's copy — so the job would pass
      # green with no review behind it. The skip guards above leave the
      # review out on purpose and are not failures. Ported from tt-pos
      # PAY-1627.
      - name: Fail if the review never ran
        if: steps.dedup.outputs.skip != 'true' && steps.pr-state.outputs.skip != 'true' && steps.stage.outputs.skip != 'true' && steps.claude-review.outputs.conclusion == ''
        run: |
          echo "::error title=Claude review did not run::claude-code-action produced no conclusion, so the review never started — a green check here would NOT be evidence of a review. The usual cause is this workflow file differing from the default branch's copy (claude-ci-cost.md § Verifying a change)."
          exit 1

      # GH-1691: the action logs only how many tool calls were denied, and
      # the transcript is hidden, so a review that stopped early left
      # nothing to diagnose it from. The execution file holds the rest:
      # each denied call, each errored tool result (a hook block is one of
      # those, not a denial), a tally of tool calls, any subagent sent to
      # the background, and the final message. Inputs are truncated: a
      # prefix shows which allow rule is missing. Ported from tt-pos
      # PAY-1627.
      - name: Report permission denials
        if: ${{ always() && steps.claude-review.outputs.execution_file != '' }}
        env:
          EXECUTION_FILE: ${{ steps.claude-review.outputs.execution_file }}
        run: |
          jq -r '
            [.[] | select(.type == "result")] | last | (.permission_denials // [])[]
            | "::warning title=Claude review permission denied::" + .tool_name + " "
              + ((.tool_input.command // .tool_input.file_path // (.tool_input | tostring)) | gsub("[\r\n]+"; " ") | .[0:200])
          ' "$EXECUTION_FILE" || echo "::warning::Could not read permission denials from $EXECUTION_FILE"
          jq -r '
            .[] | select(.type == "user") | .message.content[]?
            | select(type == "object" and .type == "tool_result" and .is_error == true)
            | .content | (if type == "array" then map(.text // "") | join(" ") else tostring end)
            | "::warning title=Claude review tool error::" + (gsub("[\r\n]+"; " ") | .[0:200])
          ' "$EXECUTION_FILE" || echo "::warning::Could not read tool errors from $EXECUTION_FILE"
          jq -r '
            [.[] | select(.type == "assistant") | .message.content[]?
              | select(type == "object" and .type == "tool_use")] as $calls
            | ($calls | map(.name) | group_by(.) | map(.[0] + " x" + (length | tostring)) | join(", ")
                | "::notice title=Claude review tool calls::" + .),
              ($calls[] | select((.name == "Task" or .name == "Agent") and .input.run_in_background == true)
                | "::warning title=Claude review backgrounded a subagent::" + (.input.subagent_type // "?") + " " + (.input.description // "")),
              ([.[] | select(.type == "result")] | last | (.result // "") | tostring
                | "::notice title=Claude review final message::" + (gsub("[\r\n]+"; " ") | .[0:500]))
          ' "$EXECUTION_FILE" || echo "::warning::Could not read tool calls from $EXECUTION_FILE"
