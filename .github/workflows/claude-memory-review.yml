name: Claude Memory Review - Post-PR Lessons Learned

on:
  pull_request:
    types: [closed]
    paths-ignore:
      - '.claude/**'
      - 'references/**'
      - '.github/workflows/claude-memory-review.yml'
      - '.github/workflows/claude-code-review.yml'
      - '.github/workflows/claude-pr-hygiene.yml'
      - '.github/workflows/claude.yml'
      - '.github/claude/**'
      - '.github/claude-ci-settings.json'
      - '.github/scripts/claude-pr-context/**'
      - 'CLAUDE.md'

jobs:
  lessons-learned:
    # Skip analysis for draft PRs and revert PRs.
    #
    # Fork PRs are skipped too (GH-1415): this job runs
    # claude-code-action, and GitHub refuses to mint an OIDC token
    # for a fork-triggered `pull_request` run. The trigger here is
    # `pull_request` rather than `pull_request_target`, so the API key is
    # withheld and nothing leaks — but the job goes red on every merged
    # fork PR, which is exactly the "trains reviewers to ignore red CI"
    # failure .claude/rules/github-workflows.md warns about. Matches the
    # guard on claude-code-review.yml and claude-pr-hygiene.yml.
    #
    # GH-1756: switched off by CLAUDE_REVIEW_ENABLED='false' or the
    # skip-claude-review label, like the two review jobs.
    if: >-
      vars.CLAUDE_REVIEW_ENABLED != 'false'
      && !contains(github.event.pull_request.labels.*.name, 'skip-claude-review')
      && github.event.pull_request.draft == false
      && !startsWith(github.event.pull_request.title, 'Revert ')
      && !github.event.pull_request.head.repo.fork
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve PR outcome
        id: pr-context
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_MERGED: ${{ github.event.pull_request.merged }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        # GH-1615: the write allow-rules Part 2 needs are granted only for
        # a merged PR. With one session for both parts, the prompt alone
        # would otherwise be all that keeps a rejected PR's run — which
        # reads untrusted PR content — away from git push and gh pr create.
        # Allow-rules gate permission, not tool schemas, so the cached
        # prefix is the same either way.
        run: |
          if [[ "$PR_MERGED" == "true" ]]; then
            outcome=merged
            write_tools=',Edit,Bash(git config:*),Bash(git checkout:*),Bash(git pull:*),Bash(git add:*),Bash(git commit:*),Bash(git push:*),Bash(gh pr create:*),Bash(gh pr edit:*),Bash(gh issue create:*)'
          else
            outcome=rejected
            write_tools=''
          fi
          {
            echo "outcome=$outcome"
            echo "write_tools=$write_tools"
            echo "pr_number=$PR_NUMBER"
            echo "pr_title=$PR_TITLE"
            echo "pr_author=$PR_AUTHOR"
            echo "pr_url=$PR_URL"
          } >> "$GITHUB_OUTPUT"

      - name: Skip cancelled PRs without comments
        id: skip-check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_MERGED: ${{ github.event.pull_request.merged }}
        run: |
          if [[ "$PR_MERGED" != "true" ]]; then
            COMMENT_COUNT=$(gh pr view "$PR_NUMBER" --json comments,reviews -q '[.comments | length, .reviews | length] | add')
            if [[ "$COMMENT_COUNT" -eq 0 ]]; then
              echo "PR was cancelled without any comments — skipping analysis"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      # GH-1615: same trusted-ref staging as claude-code-review.yml — the
      # context script runs with this job's token, and this job can push.
      # A closed PR's checkout carries whatever that PR changed, so the
      # script is taken from its base branch (or the default branch).
      - name: Stage scripts from the trusted ref
        if: steps.skip-check.outputs.skip != 'true'
        id: stage
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          dir=.github/scripts/claude-pr-context
          ref=""
          for branch in "$BASE_REF" "$DEFAULT_BRANCH"; do
            git fetch --no-tags origin "$branch"
            if git cat-file -e "FETCH_HEAD:$dir" 2>/dev/null; then
              ref=$(git rev-parse FETCH_HEAD)
              break
            fi
          done
          if [[ -z "$ref" ]]; then
            echo "::notice::Neither $BASE_REF nor $DEFAULT_BRANCH has $dir yet — skipping rather than running this PR's own copy."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/scripts"
          git archive "$ref" "$dir" | tar -x -C "$RUNNER_TEMP/scripts" --strip-components=3

      # GH-1615: the bundle the code review reads — comments, reviews,
      # threads and per-file patches, fetched once, instead of the model
      # paying a full-context turn for each `gh` call.
      - name: Gather PR context
        if: steps.skip-check.outputs.skip != 'true' && steps.stage.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: '"$RUNNER_TEMP/scripts/gather-pr-context.sh"'

      - name: Prepare output directory
        if: steps.skip-check.outputs.skip != 'true' && steps.stage.outputs.skip != 'true'
        run: mkdir -p "${{ github.workspace }}/.claude-output"

      # GH-1615: pinned CLI from CLAUDE_CLI_VERSION; see claude-code-review.yml.
      - name: Install Claude Code CLI
        if: steps.skip-check.outputs.skip != 'true' && steps.stage.outputs.skip != 'true'
        id: claude-cli
        working-directory: ${{ runner.temp }}
        env:
          CLAUDE_CLI_VERSION: ${{ vars.CLAUDE_CLI_VERSION }}
        run: |
          set -euo pipefail
          npm install --global "@anthropic-ai/claude-code@${CLAUDE_CLI_VERSION:?set the CLAUDE_CLI_VERSION repository variable}"
          cli_path=$(command -v claude)
          "$cli_path" --version
          echo "path=$cli_path" >> "$GITHUB_OUTPUT"

      # GH-1615: one session analyses the PR and, for a merged PR,
      # implements the lessons. Two sessions each paid for a full prefix,
      # and the second re-read the report and every rule file the first
      # had just read.
      - name: Run Claude Memory Review
        if: steps.skip-check.outputs.skip != 'true' && steps.stage.outputs.skip != 'true'
        id: claude-analysis
        uses: anthropics/claude-code-action@a26b07d8c778b0c43f64618e5fd29fd0f8af72e8 # v1.0.250
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # GH-1622: workload identity federation; see claude-code-review.yml
          # and claude-ci-cost.md rule 9. Never set anthropic_api_key beside
          # these: a key outranks federation.
          anthropic_federation_rule_id: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          anthropic_organization_id: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          anthropic_service_account_id: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          anthropic_workspace_id: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
          path_to_claude_code_executable: ${{ steps.claude-cli.outputs.path }}
          # GH-1615: static instructions first, per-run values last in
          # RUN CONTEXT, so every run reads the cached prompt prefix.
          prompt: |
            # Post-PR Lessons Learned

            You are analyzing a closed Pull Request to extract lessons learned
            and identify improvements for the Claude Code review process.
            Part 1 always runs. Part 2 runs only when OUTCOME in RUN CONTEXT
            is `merged`. All paths below are relative to the working
            directory, the checkout.

            # Part 1 — Analysis

            ### Step 1: Gather PR Data
            1. Read `.claude-ci/pr-context/INDEX.md`. The files it lists hold
               the PR body, commits, comments, inline review comments,
               reviews, review threads and one patch per changed file. Use
               them instead of `gh`.
            2. Read CLAUDE.md, .claude/agents/ specs, references/review-checks-common.md

            ### Step 2: Analyze Review Feedback Patterns
            For each review comment from Claude/github-actions[bot]:
            - Check if the suggestion was accepted or rejected
            - Look at human responses for reasoning
            - Note patterns in accepted vs rejected suggestions

            ### Step 3: Identify Improvements (with deduplication)
            For each potential improvement:
            1. Read the target file where the change would go
            2. Check if the concept is already covered (even in different words)
            3. Only recommend changes that add genuinely NEW guidance

            Organized by domain:
            - **Agent specs**: checklist additions fixing verified false positives
            - **Rules files**: new patterns not covered by existing rules
            - **CLAUDE.md**: only if a fundamental convention is missing

            Skip recommendations that:
            - Rephrase existing guidance in different words
            - Address one-off issues unlikely to recur
            - Would push a target file over its size budget

            ### Step 4: Create Report
            Write to `.claude-output/lessons_learned_report.md`
            with: Summary, Statistics, Feedback Analysis, Identified Improvements,
            and prioritized Action Items (High/Medium/Low).

            For each Action Item, include:
            - Target file path and current line count
            - Whether the concept already exists in the file (yes/no)
            - Recurrence evidence (which PRs showed this pattern)

            IMPORTANT:
            - Be specific with file paths and line numbers
            - Quote actual code when referencing
            - Mark items as "already covered" if target file has similar guidance
            - Merge decisions are out of scope. The author decides when a PR
              merges and owns the result. A merge with findings still open,
              a fast merge, a merge without a human review, or open hygiene
              findings is the author's call — never an incident, a bypass,
              or a lesson. Do not propose merge gates, required status
              checks, or incident logs. Lessons are about review quality:
              false positives, missed findings, and review signals that
              were read wrongly.

            If OUTCOME is not `merged`, stop here: Part 2 does not apply.

            # Part 2 — Implement Lessons Learned (OUTCOME `merged` only)

            Your task: evaluate the lessons in your Part 1 report for genuine
            value, implement only high-quality improvements, then open a PR
            ready for review (do NOT pass --draft) and request review from a
            human. Do NOT merge.

            A draft PR here is invisible by design: claude-code-review.yml
            and claude-pr-hygiene.yml both gate their jobs on
            `!github.event.pull_request.draft`, so a draft never gets CI or
            a bot review, and this repo's own convention treats drafts as
            "not yet ready to look at." Opening ready-for-review plus an
            explicit reviewer request is what gets this PR in front of a
            human instead of expiring unseen for weeks (GH-1351).

            ## Hard Constraints (NON-NEGOTIABLE)

            Only modify files in:
            - `CLAUDE.md`
            - `.claude/rules/*.md`
            - `.claude/agents/*.md`
            - `references/*.md`

            Never touch:
            - `skills/` (plugin code)
            - `.github/workflows/` (CI config — would create infinite loops)
            - `bin/`, `hooks/`, `commands/`, or any other file

            Never add merge gates, merge conditions, or "recorded incident"
            paragraphs about how or when a PR was merged. The author owns
            the merge decision; skip any action item that would, and say so
            in the PR body.

            ## Value Filter (MANDATORY — apply before ANY implementation)

            For each proposed change from the report, apply these checks
            in order. **Skip the item** if any check fails:

            1. **Deduplication**: Read the target file. Search for the
               concept being proposed. If the guidance already exists
               (even in different words), SKIP. Rephrasing existing rules
               adds bloat without value.

            2. **Recurrence test**: Does this address a pattern that has
               occurred in 2+ PRs, or is it a one-off observation? One-off
               observations are not worth adding to permanent rules. SKIP
               items that say "PR #N showed..." without evidence of recurrence.

            3. **Actionability test**: Would a reviewer use this guidance to
               make a different decision? If it is general advice ("be careful
               with X") rather than a concrete check ("verify X exists in Y"),
               SKIP.

            4. **Budget gate**: Count the target file's current line count.
               If adding the change would exceed the budget, SKIP. Do NOT
               create overflow — the budget is a hard cap, not advisory.
               Budgets: CLAUDE.md ≤ 100, agent specs ≤ 50, rules ≤ 200,
               references ≤ 200.

            **Minimum threshold**: If fewer than 2 items survive filtering,
            write "none" to `.claude-output/docs_pr_url.txt` and STOP. One
            marginal improvement is not worth a PR.

            ## Writing Style for Insights

            Write as distilled trade-off reasoning without PR# attribution:
            - GOOD: "Skills with vague descriptions get skipped by the router"
            - BAD: "PR #42 showed that skill descriptions matter"

            ## PR & Commit Convention (MANDATORY)

            Read `references/git-jtbd.md` and `references/git-pr.md` first.

            - Titles describe **what reviewers/contributors can now do**
            - Use `🤖` emoji prefix — never other gitmoji
            - PR body starts with JTBD Job Story as first paragraph

            ## Steps

            1. From the "Action Items" of your Part 1 report, collect
               **High** and **Medium** items targeting allowed files only.

            2. Apply the Value Filter to each item. Log which items were
               skipped and why (include in PR body under "Filtered items").
               For an item that is a genuine improvement but falls outside
               the four allowed file globs, or otherwise cannot be applied
               in this run, file it as a follow-up issue instead of leaving
               it only as PR prose — prose in a PR that may sit unreviewed
               does not survive; a filed issue does. Write its body with the
               Write tool to `.claude-output/issue-<n>.md`, then run
               `gh issue create --title "..." --body-file .claude-output/issue-<n>.md`.
               Link the issue in "Filtered items" alongside the skip reason.

            3. If fewer than 2 items survive, write "none" to
               `.claude-output/docs_pr_url.txt` and stop.

            4. For each surviving item, the target file is already read;
               apply the minimal precise change. Do not refactor surrounding
               content.

            5. Configure git identity:
               git config user.email "github-actions[bot]@users.noreply.github.com"
               git config user.name "github-actions[bot]"

            6. Create branch from develop:
               git checkout develop
               git pull origin develop
               git checkout -B "claude/lessons-pr-<PR>"

            7. Stage only allowed paths and commit:
               git add CLAUDE.md .claude/ references/
               git commit -m "🤖 <outcome-focused title, max 72 chars>"

            8. Write the PR body with the Write tool to
               `.claude-output/pr_body.md`: the JTBD Job Story first, then
               `## Changes applied` (bullet list of surviving items), then
               `## Filtered items (skipped)` (bullet list with the skip
               reason for each, including any filed follow-up issue links),
               then a final line `Based on: <PR_URL>`.

            9. Push and open a PR targeting develop, ready for review
               (do NOT pass --draft — a draft is invisible to
               claude-code-review.yml, claude-pr-hygiene.yml, and CI in
               this repo, GH-1351):
               git push origin "claude/lessons-pr-<PR>"
               gh pr create --title "🤖 <outcome-focused title>" --body-file .claude-output/pr_body.md --base develop

            10. Request review from a human so this PR reaches someone
                instead of expiring unseen:
                gh pr edit "claude/lessons-pr-<PR>" --add-reviewer "<PR_AUTHOR>"
                This is best-effort: if it fails (e.g. the account cannot
                be requested), carry on — the PR itself must still be
                delivered.

            11. Write the PR URL to `.claude-output/docs_pr_url.txt`

            RUN CONTEXT:
            - REPO: ${{ github.repository }}
            - PR: ${{ steps.pr-context.outputs.pr_number }}
            - PR_URL: ${{ steps.pr-context.outputs.pr_url }}
            - PR_TITLE: ${{ steps.pr-context.outputs.pr_title }}
            - PR_AUTHOR: ${{ steps.pr-context.outputs.pr_author }}
            - OUTCOME: ${{ steps.pr-context.outputs.outcome }}

          # GH-1615: the first four flags are the shared CI prefix (see
          # claude-code-review.yml). --tools leaves only the built-in tools
          # the two parts use. Part 1 reads the context bundle, so it needs
          # no `gh` read access. write_tools is empty unless the PR merged
          # (see "Resolve PR outcome").
          claude_args: '--settings .github/claude-ci-settings.json --append-system-prompt-file .github/claude/ci-system-prompt.md --exclude-dynamic-system-prompt-sections --disallowed-tools "ScheduleWakeup,Monitor" --model haiku --tools "Bash,Read,Write,Edit,Glob,Grep" --allowed-tools "Read,Write,Glob,Grep${{ steps.pr-context.outputs.write_tools }}"'

      # GH-1615: cost and cache use of this run; see claude-code-review.yml.
      - name: Report Claude usage
        if: ${{ always() && steps.claude-analysis.outputs.execution_file != '' }}
        env:
          EXECUTION_FILE: ${{ steps.claude-analysis.outputs.execution_file }}
        run: |
          jq -r '[.[] | select(.type == "result")] | last
            | "### Claude usage\n\n| Model | Input | Cache write | Cache read | Output | Cost (USD) |\n|---|---:|---:|---:|---:|---:|\n"
              + ((.modelUsage // {}) | to_entries | map("| \(.key) | \(.value.inputTokens // 0) | \(.value.cacheCreationInputTokens // 0) | \(.value.cacheReadInputTokens // 0) | \(.value.outputTokens // 0) | \(.value.costUSD // 0 | . * 10000 | round / 10000) |") | join("\n"))
              + "\n\n**Total:** $\(.total_cost_usd // 0 | . * 100 | round / 100) · \(.num_turns // 0) turns · \((.permission_denials // []) | length) permission denials\n"' \
            "$EXECUTION_FILE" >> "$GITHUB_STEP_SUMMARY" || echo "::warning::Could not read usage from $EXECUTION_FILE"
          jq -r '[.[] | select(.type == "result")] | last | [(.modelUsage // {})[]] as $m
            | "::notice title=Claude usage::$\(.total_cost_usd // 0) · \(.num_turns // 0) turns · cache read \($m | map(.cacheReadInputTokens // 0) | add // 0) · cache write \($m | map(.cacheCreationInputTokens // 0) | add // 0) · uncached input \($m | map(.inputTokens // 0) | add // 0)"' \
            "$EXECUTION_FILE" || true

      - name: Read documentation PR URL
        if: always() && steps.skip-check.outputs.skip != 'true' && steps.stage.outputs.skip != 'true'
        id: docs-pr
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}
        run: |
          DOCS_PR_FILE="${GITHUB_WORKSPACE}/.claude-output/docs_pr_url.txt"
          if [ -f "$DOCS_PR_FILE" ]; then
            DOCS_PR_URL=$(cat "$DOCS_PR_FILE")
            if [ "$DOCS_PR_URL" = "none" ]; then
              echo "No implementable changes — no docs PR created"
              echo "url=" >> "$GITHUB_OUTPUT"
            else
              echo "Documentation PR: $DOCS_PR_URL"
              echo "url=$DOCS_PR_URL" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "docs_pr_url.txt not found"
            echo "url=" >> "$GITHUB_OUTPUT"
          fi

      - name: Post analysis report to documentation PR
        if: >-
          always()
          && steps.docs-pr.outputs.url != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_WORKSPACE: ${{ github.workspace }}
          DOCS_PR_URL: ${{ steps.docs-pr.outputs.url }}
        run: |
          REPORT_FILE="${GITHUB_WORKSPACE}/.claude-output/lessons_learned_report.md"
          if [ -f "$REPORT_FILE" ]; then
            DOCS_PR_NUMBER=$(echo "$DOCS_PR_URL" | grep -o '[0-9]*$')
            gh pr comment "$DOCS_PR_NUMBER" --body-file "$REPORT_FILE"
            echo "Posted analysis report as comment on PR #$DOCS_PR_NUMBER"
          else
            echo "Report file not found, skipping comment"
          fi
