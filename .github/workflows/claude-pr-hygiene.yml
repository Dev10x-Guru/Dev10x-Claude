name: PR Hygiene Review

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    types: [opened, ready_for_review]

jobs:
  hygiene-review:
    # GH-1226: GitHub refuses OIDC minting for a pull_request run from a
    # fork, so claude-code-action cannot authenticate and this job fails
    # at token minting every time — reporting a red check that says
    # `id-token: write` is missing when it is declared right below. Skip
    # instead, so a fork PR reads as not-reviewed rather than broken.
    # Both checks are non-required, so nothing that gated a merge is
    # lost. Getting actual review coverage on fork PRs needs a
    # workflow_run split or pull_request_target, neither of which is a
    # trigger swap — see the issue.
    if: >-
      !github.event.pull_request.draft
      && !github.event.pull_request.head.repo.fork
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      # The comment is posted with the job token, and a PR's conversation
      # comments are issue comments.
      issues: write
      id-token: write

    steps:
      - name: Skip if duplicate SHA run exists
        id: dedup
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PEER_RUN=$(gh api \
            "repos/${{ github.repository }}/actions/runs?head_sha=${{ github.sha }}&per_page=10" \
            --jq "[.workflow_runs[] | select(.name == \"${{ github.workflow }}\" and .id != ${{ github.run_id }} and .conclusion != \"cancelled\" and .conclusion != \"skipped\" and .status != \"queued\")] | first | .id // empty" \
            2>/dev/null || true)
          if [ -n "$PEER_RUN" ]; then
            echo "::notice::Skipping duplicate run — SHA ${{ github.sha }} already handled by run $PEER_RUN"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip if PR already merged or closed
        if: steps.dedup.outputs.skip != 'true'
        id: pr-state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          STATE=$(gh pr view ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} --json state -q '.state')
          if [ "$STATE" != "OPEN" ]; then
            echo "::notice::Skipping — PR #${{ github.event.pull_request.number }} is $STATE"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      # Shallow: commits come from the PR context below, so the checkout
      # only has to supply the rule files the prompt reads.
      - name: Checkout repository
        if: steps.dedup.outputs.skip != 'true' && steps.pr-state.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # GH-1585: same trusted-ref staging as claude-code-review.yml — the
      # context script runs with this job's token.
      - name: Stage scripts from the trusted ref
        if: steps.dedup.outputs.skip != 'true' && steps.pr-state.outputs.skip != 'true'
        id: stage
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          dir=.github/scripts/claude-pr-context
          ref=""
          for branch in "$BASE_REF" "$DEFAULT_BRANCH"; do
            git fetch --no-tags --depth=1 origin "$branch"
            if git cat-file -e "FETCH_HEAD:$dir" 2>/dev/null; then
              ref=$(git rev-parse FETCH_HEAD)
              break
            fi
          done
          if [[ -z "$ref" ]]; then
            echo "::notice::Neither $BASE_REF nor $DEFAULT_BRANCH has $dir yet — skipping rather than running this PR's own copy."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/scripts"
          git archive "$ref" "$dir" | tar -x -C "$RUNNER_TEMP/scripts" --strip-components=3

      # GH-1585: everything the check needs is fetched here, so the model
      # makes no API calls of its own. The previous hygiene comment is
      # picked by author AND marker, so a marker forged in a human's
      # comment is never chosen.
      - name: Gather PR context
        if: steps.dedup.outputs.skip != 'true' && steps.pr-state.outputs.skip != 'true' && steps.stage.outputs.skip != 'true'
        id: pr-data
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          "$RUNNER_TEMP/scripts/gather-pr-context.sh"
          ctx=.claude-ci/pr-context
          jq '[.[] | select(.user == "github-actions[bot]"
                and (.body | contains("<!-- dev10x-pr-hygiene -->")))] | last // {}' \
            "$ctx/issue-comments.json" > "$ctx/prior-hygiene-comment.json"
          echo "comment_id=$(jq -r '.id // empty' "$ctx/prior-hygiene-comment.json")" >> "$GITHUB_OUTPUT"

      # GH-1615: pinned CLI from CLAUDE_CLI_VERSION; see claude-code-review.yml.
      - name: Install Claude Code CLI
        if: steps.dedup.outputs.skip != 'true' && steps.pr-state.outputs.skip != 'true' && steps.stage.outputs.skip != 'true'
        id: claude-cli
        working-directory: ${{ runner.temp }}
        env:
          CLAUDE_CLI_VERSION: ${{ vars.CLAUDE_CLI_VERSION }}
        run: |
          set -euo pipefail
          npm install --global "@anthropic-ai/claude-code@${CLAUDE_CLI_VERSION:?set the CLAUDE_CLI_VERSION repository variable}"
          cli_path=$(command -v claude)
          "$cli_path" --version
          echo "path=$cli_path" >> "$GITHUB_OUTPUT"

      - name: Run PR Hygiene Review
        if: steps.dedup.outputs.skip != 'true' && steps.pr-state.outputs.skip != 'true' && steps.stage.outputs.skip != 'true'
        id: hygiene-review
        uses: anthropics/claude-code-action@a26b07d8c778b0c43f64618e5fd29fd0f8af72e8 # v1.0.250
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        with:
          # GH-1622: workload identity federation; see claude-code-review.yml
          # and claude-ci-cost.md rule 9. Never set anthropic_api_key beside
          # these: a key outranks federation.
          anthropic_federation_rule_id: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          anthropic_organization_id: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          anthropic_service_account_id: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          anthropic_workspace_id: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
          path_to_claude_code_executable: ${{ steps.claude-cli.outputs.path }}
          # GH-1585: static instructions first, per-run values last in
          # RUN CONTEXT, so every run reads the cached prompt prefix.
          prompt: |
            You are reviewing a PR for metadata hygiene — title, description,
            and commit history quality. This is NOT a code review. You have
            no `gh` access: a step before you fetched everything, and a step
            after you posts what you write.

            REQUIRED FIRST STEP:
            Read these files:
            1. references/git-commits.md — conventions for commit messages,
               PR titles, and branch naming
            2. references/git-pr.md — PR body format, grooming, review feedback
            3. references/git-jtbd.md — Job Story format, principles,
               anti-patterns, and examples for outcome-focused titles

            PR DATA — Read these files in `.claude-ci/pr-context/`:
            - `pr.json`: title, body, author, head branch (headRefName)
            - `commits.json`: every commit's headline and body

            ANALYZE THREE AREAS:

            1. **PR Title**
               - Must follow: `<gitmoji> <TICKET-ID> <JTBD-inspired description>`
               - Max 72 characters
               - Ticket ID must be present (extract expected ID from branch name)
               - Description SHOULD be outcome-focused (JTBD) for user-facing features
               - For meta-work (docs, tooling, refactoring), implementation-focused
                 titles are acceptable if the PR body explains the "why" using JTBD
               - Bad: "Add X to Y" without context — Good: "Enable Z" (outcome)

            2. **PR Description (body)**
               - Must start with a JTBD Job Story as the **first paragraph** (1-3 lines)
                 Format: `**When** [situation], **[actor] wants to** [motivation], **so [beneficiary] can** [outcome]`
                 A Job Story written in the project's language is equally valid, using
                 that language's markers — Polish is
                 `**Gdy** …, **[rola] chce** …, **żeby [beneficjent] mógł** …`.
                 Accept ONE language throughout; a story mixing English markers with
                 another language's prose is a finding, not a pass (GH-1291).
                 The release notes process collects Job Stories by position — it must
                 come before the commit list and any other content
               - May optionally include a compact commit list with links
               - Must end with `Fixes: https://github.com/Dev10x-Guru/dev10x-claude/issues/NUMBER`
               - Should NOT contain summaries or checklists (those go in the first comment)

            3. **Commits**
               - Each commit title: `<gitmoji> <TICKET-ID> <description>`
               - Atomic: one logical change per commit
               - No fixup! or squash! commits remaining
               - Titles should be outcome-focused where possible

            SEVERITY LABELS:
            Classify each issue as REQUIRED or RECOMMENDED:
            - **REQUIRED**: Violations that break tooling or integration
              - Missing gitmoji (breaks changelog generation)
              - No `Fixes:` link (breaks GitHub issue integration)
              - Fixup commits remaining (blocks merge)
              - Missing JTBD Job Story as first paragraph (breaks release
                notes collection)
              - JTBD not the first paragraph (commit list or other content
                appears before the Job Story)
            - **RECOMMENDED**: Style preferences that improve consistency
              - Compact commit list format
              - Ticket ID in title (helps tracking, omit for meta-work)
              - JTBD-style title wording (preferred, not enforced for
                infrastructure/tooling PRs)

            TICKET ID VALIDATION:
            Before suggesting a ticket ID from the branch name:
            - Skip placeholder-looking IDs (e.g., `1234`, `0000`, `9999`)
            - Skip IDs from auto-generated branch names (random suffix
              patterns like `-knDH7`, `-7n0Qz`)
            - Only suggest ticket IDs that look intentional

            WRITE THE COMMENT — your only output:
            Write the comment body with the Write tool to
            `.claude-ci/hygiene-comment.md`, on every run. Do not post it:
            the step after you edits this workflow's existing hygiene
            comment in place, creates one when there is none, and posts
            nothing when all checks pass and no comment exists yet.
            - When ANY issues are found:
              - No header — keep the comment compact and scannable
              - A flat list of issues, each on its own line as a bullet point
              - Each bullet prefixed with **REQUIRED** or **RECOMMENDED** label
              - Each bullet includes a concrete fix (alternative wording, example)
              - When flagging non-outcome-focused titles, append:
                "📖 See `references/git-jtbd.md`"
              - Keep tone constructive — this is a helpful nudge, not a gate
            - When ALL checks pass, the body is the single line
              `✅ PR hygiene checks pass.`

            IMPORTANT:
            - Do NOT review code quality, architecture, or tests — that's handled
              by the code review workflow
            - Do NOT approve or request changes — only comment
            - Be concise — the goal is a quick, actionable checklist

            RUN CONTEXT:
            - REPO: ${{ github.repository }}
            - PR: ${{ github.event.pull_request.number }}

          # GH-1585: the first four flags are the shared, byte-stable CI
          # prefix (see claude-code-review.yml). --tools leaves only the two
          # tools this job uses, so the prefix carries no other tool schemas.
          claude_args: '--settings .github/claude-ci-settings.json --append-system-prompt-file .github/claude/ci-system-prompt.md --exclude-dynamic-system-prompt-sections --disallowed-tools "ScheduleWakeup,Monitor" --model haiku --tools "Read,Write" --allowed-tools "Read,Write"'

      # GH-1585: see claude-code-review.yml.
      - name: Report Claude usage
        if: ${{ always() && steps.hygiene-review.outputs.execution_file != '' }}
        env:
          EXECUTION_FILE: ${{ steps.hygiene-review.outputs.execution_file }}
        run: |
          jq -r '[.[] | select(.type == "result")] | last
            | "### Claude usage\n\n| Model | Input | Cache write | Cache read | Output | Cost (USD) |\n|---|---:|---:|---:|---:|---:|\n"
              + ((.modelUsage // {}) | to_entries | map("| \(.key) | \(.value.inputTokens // 0) | \(.value.cacheCreationInputTokens // 0) | \(.value.cacheReadInputTokens // 0) | \(.value.outputTokens // 0) | \(.value.costUSD // 0 | . * 10000 | round / 10000) |") | join("\n"))
              + "\n\n**Total:** $\(.total_cost_usd // 0 | . * 100 | round / 100) · \(.num_turns // 0) turns · \((.permission_denials // []) | length) permission denials\n"' \
            "$EXECUTION_FILE" >> "$GITHUB_STEP_SUMMARY" || echo "::warning::Could not read usage from $EXECUTION_FILE"
          jq -r '[.[] | select(.type == "result")] | last | [(.modelUsage // {})[]] as $m
            | "::notice title=Claude usage::$\(.total_cost_usd // 0) · \(.num_turns // 0) turns · cache read \($m | map(.cacheReadInputTokens // 0) | add // 0) · cache write \($m | map(.cacheCreationInputTokens // 0) | add // 0) · uncached input \($m | map(.inputTokens // 0) | add // 0)"' \
            "$EXECUTION_FILE" || true

      # GH-1585: posting is deterministic — one comment per PR, edited in
      # place. The job token posts as github-actions[bot], and events it
      # causes start no workflows, so the edit cannot re-trigger this check.
      - name: Post hygiene comment
        if: ${{ steps.hygiene-review.outputs.conclusion == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          COMMENT_ID: ${{ steps.pr-data.outputs.comment_id }}
        run: |
          body=.claude-ci/hygiene-comment.md
          if [[ ! -s "$body" ]]; then
            echo "::error title=Hygiene review wrote no comment::The model finished without writing $body."
            exit 1
          fi
          printf '\n<!-- dev10x-pr-hygiene -->\n' >> "$body"
          if [[ -n "$COMMENT_ID" ]]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${COMMENT_ID}" -F body=@"$body" > /dev/null
            echo "Updated hygiene comment $COMMENT_ID."
          elif grep -q '^✅ PR hygiene checks pass\.' "$body"; then
            echo "All hygiene checks pass and there is no earlier comment to clear; nothing to post."
          else
            gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$body"
          fi
