name: Close linked issues on merge

on:
  pull_request:
    types: [closed]

jobs:
  close-issues:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      # `contents: read` is required now that the job checks out the repo to
      # run bin/extract-linked-issues.py. Naming any scope in this block sets
      # every unnamed scope to `none`, so without this line actions/checkout
      # fails — and a job that cannot start closes nothing, which is the
      # failure mode GH-1196 exists to end.
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Close issues referenced in PR body
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # GH-1196, GH-1819, GH-1873: the extractor owns the whole
          # decision, so it is covered by tests/bin rather than by a merge.
          # 0 = references to close, 3 = declared `Fixes: none`, else fail.
          set +e
          verdict=$(printf '%s' "$PR_BODY" \
            | ./bin/extract-linked-issues.py --repo "$PR_REPO")
          status=$?
          set -e
          case "$status" in
            0) refs=$verdict ;;
            3) printf '%s\n' "$verdict"; exit 0 ;;
            *) printf '%s\n' "$verdict"; exit 1 ;;
          esac

          failed=0
          while read -r ref; do
            repo="${ref%#*}"
            number="${ref#*#}"

            # Report the prior state so "already closed" is an observation
            # rather than an assumption. The old `|| echo "may already be
            # closed"` swallowed permission errors and wrong-repo failures
            # as benign.
            # `< /dev/null` on every gh call in this loop: the loop reads the
            # ref list from stdin, and a child that touches stdin would eat
            # the remaining refs — silently closing only the first issue,
            # which is this workflow's original failure mode wearing a
            # different hat.
            state=$(gh issue view "$number" --repo "$repo" \
              --json state -q '.state' < /dev/null 2>/dev/null || echo "UNKNOWN")

            if [ "$state" = "CLOSED" ]; then
              echo "  $repo#$number: already closed, skipping"
              continue
            fi
            if [ "$state" = "UNKNOWN" ]; then
              echo "::error::$repo#$number: not readable (missing, wrong repo, or no permission)"
              failed=1
              continue
            fi

            if gh issue close "$number" \
              --repo "$repo" \
              --comment "Closed by #${PR_NUMBER}" < /dev/null; then
              echo "  $repo#$number: closed"
            else
              echo "::error::$repo#$number: close failed"
              failed=1
            fi
          done <<< "$refs"

          exit "$failed"
