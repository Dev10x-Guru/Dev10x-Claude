# Friction preset: adaptive — the SOLE shipped base preset (ADR-0022 D-1).
# Auto-advance is the baseline: every gate resolves to its recommended
# option unless a safety floor, a project pin, or a per-toggle override
# says otherwise. The `strict` and `guided` columns are retired; the
# supervisor boundary they reached for now lives in `supervisor_review`
# (ADR-0022 D-2/D-3) and in the project-tier `.dev10x/gate-policy.yaml`
# pins (`merge: ask`, `external_notify: ask`).
#
# This file is the shipped source of truth the infra tier hydrates into
# `dev10x.domain.gate_policy.SHIPPED_PRESETS` (ADR-0016 D-1). A
# drift-guard test asserts the two stay identical — edit both together.
plan_approval: auto-advance
batch_layout: auto-advance
strategy_choice: auto-advance
artifact_preview: auto-advance
triage_response: auto-advance-if-bot
thread_resolution: auto-advance-if-bot
comment_hide: auto-advance-if-bot
yagni_routing: auto-advance
shipping_continuation: auto-advance
request_review: auto-advance
external_notify: ask
merge: auto-advance
completion_signoff: auto-advance
history_rewrite: auto-advance-if-safe
workspace_choice: auto-advance
branch_cleanup: auto-advance-if-merged
session_adoption: auto-advance-if-stale-free
zero_valid_autoflow: true
autofix_confidence: 70
batch_ambiguity_floor: 3
anchor_recommendations: true
doubt_sink: pr-description
