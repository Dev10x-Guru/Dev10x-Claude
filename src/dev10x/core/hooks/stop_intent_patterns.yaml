# Phrases that declare an imminent action at the end of a turn (GH-1829).
#
# Read by dev10x.core.hooks.stop_verdict. A turn whose closing paragraph
# holds a sentence that matches an `intent` pattern and no `exempt`
# pattern, ran no tool after that text and left no AskUserQuestion open
# is blocked: the supervisor would otherwise read "Now I'll run the
# tests" as work in progress and come back to an idle session.
#
# Patterns are Python regular expressions, matched case-insensitively
# after curly apostrophes are normalized to "'". `intent` is matched
# against each sentence of the closing paragraph; the other lists
# against each clause of it, cut at `,` `;` `:` and an em dash
# (GH-1894). An excuse covers only its own sentence (GH-1854), so "If
# you see failures, I'll fix them." cannot excuse an unconditional "Now
# I'll run the tests." beside it. Every language's lists are merged, so
# a new language is a new key under `languages:` and nothing else.
#
# An excuse is strong or weak, in the promise's own clause as anywhere
# else in the sentence:
# - `exempt` is strong anywhere: a wait, a gate on the supervisor's
#   decision, a deferral past this session ("Ping me once you approve,
#   I'll merge it now").
# - `condition` opens a clause ("If you see failures") and reaches only
#   the clauses after it: "I'll run the tests, if you don't mind" asks
#   nothing. It is strong when it opens the sentence or a list item and
#   is not a preference, weak otherwise.
# - `preference` names what the supervisor would like, and is weak.
# - `immediate` says a promise is not waiting, which defeats a weak
#   excuse: "Let me know if you'd like, I'll run the tests now" is a
#   hedge built from a gate phrase, and so is "I'll run the tests now if
#   you'd like" with no comma. Only the promise's own clauses are read
#   for it, so "…, I'll merge it; CI is green now" is still excused.
#
# Keep the excusing lists honest: over-firing is what turns a Stop
# gate into noise. A promise conditioned on the supervisor ("once you
# approve, I'll merge"), a wait, or work explicitly deferred past this
# session is not an action this turn skipped. Keep them narrow too: an
# exemption that matches ordinary hedging ("let me know if you
# disagree") lets an unconditional promise through (GH-1869), and a
# colon lead-in carries its exemption into every list item under it.

languages:
  en:
    # Separators are written `(?:\s*,\s*|\s+)` rather than `\s*,?\s+`:
    # the two alternatives cannot overlap, so a long run of spaces is
    # matched one way only instead of backtracking quadratically.
    intent:
      # "Now I'll …", "Next, I will …", "Then I'm going to …"
      - "\\b(?:now|next|then|first)(?:\\s*,\\s*|\\s+)I(?:'ll|\\s+will|'m\\s+going\\s+to|\\s+am\\s+going\\s+to)\\b"
      # "I'll now …", "I will next …", "I'll go ahead and …"
      - "\\bI(?:'ll|\\s+will)\\s+(?:now|next|then|first|immediately|go\\s+ahead\\s+and)\\b"
      # "I'm about to …", "I am going to …" — but not "going to be honest"
      - "\\bI(?:'m|\\s+am)\\s+(?:about|going)\\s+to\\s+(?!be\\b)"
      # "Next, let's …", "Now let us …"
      - "\\b(?:now|next)(?:\\s*,\\s*|\\s+)let(?:'s|\\s+us)\\b"
      # A bare "I'll <verb>" / "I will <verb>" / "Let me <verb>" naming
      # tool-shaped work — so "let me know", "let me summarize" and
      # "let me be clear" stay quiet
      - "\\b(?:let\\s+me|I(?:'ll|\\s+will))\\s+(?:run|re-?run|start|check|fix|create|open|push|commit|merge|apply|write|add|update|read|investigate|implement|retry|launch|dispatch|edit|remove|rebase|verify|review|post|file|draft|invoke|call|kick\\s+off)\\b"
      - "\\b(?:let\\s+me\\s+look|I(?:'ll|\\s+will)\\s+(?:proceed|continue))\\b"
    exempt:
      # Waiting or yielding is a legitimate end of a turn
      - "\\bI(?:'ll|\\s+will)\\s+(?:wait|stand\\s+by|be\\s+here|leave|pause|stop|hold)\\b"
      # Conditioned on the supervisor speaking first. GH-1339 ruled that
      # a prose deferral ("say go and I'll push it") is not this gate's
      # business, so a promise waiting on their word stays quiet here.
      #
      # A bare "if you" is not such a condition (GH-1869): "Let me know
      # if you disagree, I'll run the tests now" hedges, and nothing in
      # it waits on the supervisor. Opening a clause it is a `condition`
      # below; elsewhere it excuses only through a phrase here that
      # gates the promise on the supervisor ("I'll rebase it if you'd
      # like"). "Once/after you" is a wait wherever it sits ("I'll push
      # it once you've fixed the tests"), so it needs no gate phrase.
      - "\\b(?:once|after)\\s+you\\b"
      - "\\bwhen\\s+you(?:'ve|\\s+have)?\\s+(?:accept(?:s|ed)?|read|tell\\s+me|let\\s+me\\s+know|approve[sd]?|agree[sd]?|confirm(?:s|ed)?|decide[sd]?|pick(?:s|ed)?|choose[sn]?|chosen|chose|give[sn]?|gave|sign(?:s|ed)?|says?|said|review(?:s|ed)?|ok(?:ay)?(?:s|ed|'d)?|repl(?:y|ies|ied)|respond(?:s|ed)?|answer(?:s|ed)?|(?:approv|agree|confirm|decid|pick|choos|giv|sign|say|review|okay|reply|respond|answer)ing)\\b"
      - "\\b(?:if|when)\\s+you(?:'re|\\s+are)\\s+(?:ready|happy|done|ok|okay|fine|good|sure)\\b"
      - "\\b(?:if|when)\\s+you(?:'d|\\s+would)?\\s+(?:approve|accept|agree|decide|choose|pick|ask|confirm|say|give|ok|okay)\\b"
      - "\\b(?:say|give\\s+me)\\s+(?:go|the\\s+word|the\\s+go-ahead)\\b"
      - "\\bwith\\s+your\\s+(?:ok|okay|approval|go-ahead)\\b"
      # Deferred past this turn on purpose
      - "\\b(?:later\\s+today|tomorrow|next\\s+session|next\\s+time)\\b"
    preference:
      # What the supervisor would like rather than what they decide:
      # the phrase a hedge is built from ("Let me know if you'd like,
      # I'll run the tests now"). It excuses a promise only when that
      # promise is not happening now: "I'll rebase it if you'd like"
      # waits, "I'll rebase it now if you'd like" does not.
      - "\\b(?:if|when)\\s+you(?:'d|\\s+would|\\s+do)?\\s+(?:want(?:ed)?|wish|prefer|rather|like|care\\s+to|need\\s+me\\s+to)\\b"
      - "\\b(?:if|when)\\s+you(?:'re|\\s+are)\\s+(?:interested|curious|keen)\\b"
    condition:
      # "If/when/once/after you" opening a clause conditions it and the
      # clauses after it ("If you see failures, I'll fix them"). Matched
      # against the clause with its edges trimmed, so a list bullet,
      # number, quote, bracket or Markdown emphasis may precede it, and
      # so may a connective ("So if you…", "Otherwise, if you…"). A list
      # item is judged after its colon lead-in, and the colon ends a
      # clause, so "Here is the plan:\n- If you see failures, …" opens
      # one too.
      - "^[\\s*_>+•(\"'`\\[-]*(?:\\d+[.)]\\s*[*_]*)?(?:(?:and|but|so|otherwise|also|or|then|okay|ok)\\b\\s+)?(?:if|once|when|after)\\s+you\\b"
    immediate:
      # The promise is happening now, so a gate in another clause of the
      # sentence is a hedge, not a condition on it.
      - "\\b(?:now|right\\s+away|immediately|straight\\s+away)\\b"
