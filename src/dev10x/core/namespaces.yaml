# Target namespace for every src/dev10x module (ADR-0034, GH-1525).
#
# Keys are module prefixes; the longest matching prefix wins. Every
# top-level dev10x.<name> module or package needs an entry, so a new
# package cannot default into a namespace by accident. Values are the
# plugin keys from plugins.yaml.
