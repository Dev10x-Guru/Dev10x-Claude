# Target namespace for every src/dev10x module (ADR-0034, GH-1525).
#
# Keys are module prefixes; the longest matching prefix wins. Every
# top-level dev10x.<name> module or package needs an entry, so a new
# package cannot default into a namespace by accident. Values are the
# plugin keys from plugins.yaml.
namespaces:
  dev10x: core
  dev10x.ci_review: core
  dev10x.cli: core
  dev10x.coding: coding
  dev10x.comm: comm
  dev10x.commands: core
  dev10x.core: core
  dev10x.core.utilities.slack: comm
  dev10x.db: db
  dev10x.dependency_pins: core
  dev10x.dependency_sweep: core
  dev10x.infra: infra
  dev10x.mcp: core
  dev10x.qa: qa
  dev10x.repo_scan: core
  dev10x.scoping: scoping
  dev10x.skills: core
  dev10x.skills.evidence: qa
  dev10x.tasks: tasks
  dev10x.teach: teach
