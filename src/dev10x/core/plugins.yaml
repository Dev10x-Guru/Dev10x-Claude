# Target plugin for every directory under skills/ (ADR-0034, GH-1524).
#
# Keys are the Python namespaces Stage A moves code into
# (dev10x.<key>); `core` keeps the plugin name `dev10x`. Every skill
# directory appears exactly once — tests/core/test_plugin_map.py
# fails on a missing, duplicated, or unknown entry.
#
# `plugin_names` is the manifest name each key ships under (GH-1580):
# `dev10x` for core, `dev10x-<key>` for every satellite. Extraction
# moves a skill's invocation name to `<plugin name>:<skill>`, and
# `dev10x skill rename` reads its target prefixes from here.
#
# `marketplace` is where every plugin installs from; an install id is
# `<plugin name>@<marketplace>`. `extracted` lists the keys that already
# ship as their own plugin (Stage B). Until a key is listed there, its
# code ships inside `dev10x` and `dev10x.core.plugin_enablement` resolves
# it to the core install id.
#
# `dependencies` are hard install dependencies (core is implicit for
# every plugin); they must name known keys and stay acyclic.
# `soft_dependencies` are mutual `Skill()` edges that degrade when the
# other plugin is absent (ADR-0034: coding<->scoping, QA->coding).
marketplace: Dev10x-Guru
extracted: []
dependencies:
  coding:
    - tasks
soft_dependencies:
  coding:
    - scoping
  scoping:
    - coding
  qa:
    - coding
plugin_names:
  qa: dev10x-qa
  infra: dev10x-infra
  db: dev10x-db
  comm: dev10x-comm
  teach: dev10x-teach
  tasks: dev10x-tasks
  scoping: dev10x-scoping
  core: dev10x
  coding: dev10x-coding
