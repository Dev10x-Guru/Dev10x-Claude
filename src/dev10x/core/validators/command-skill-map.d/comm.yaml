# DX006 rules for the comm plugin (ADR-0034 Stage A3, GH-1590).
# Merged into ../command-skill-map.yaml by dev10x.core.config.loader:
# core's rules first, then each fragment in src/dev10x/core/plugins.yaml
# order. First match wins. See the base file for the schema.

rules:
  - name: slack-api
    matcher: Bash
    patterns:
      - curl.*slack.com/api
      - curl.*hooks.slack.com
    hook_block: false
    compensations:
      - type: use-skill
        skill: dev10x:slack
    reason: >
      Direct Slack API calls bypass token management and
      structured message formatting.

  - name: gog-global-flags-first
    matcher: Bash
    patterns:
      - "^\\s*gog\\s+--?[A-Za-z]"
    except:
      - "gog --version"
      - "gog --help"
    # Advisory: a leading flag is not unsafe, it only stops the catalogued
    # read rules from matching, so the hook must not deny or ask. It
    # steers live instead (GH-1725): the compensation below reaches the
    # agent as additionalContext before the permission prompt fires.
    hook_block: false
    live_hint: true
    compensations:
      - type: use-alternative
        description: >
          Move gog's global flags after the subcommand path:
          `gog chat messages list spaces/<id> -a <account> --readonly
          --json`, not `gog -a <account> --readonly chat messages list …`.
          gog accepts every global flag after the path, and only that
          order lets `Bash(gog chat messages list:*)` match.
    reason: >
      Allow rules match a command prefix. `gog -a <account> --readonly chat
      messages list …` starts with the flags, so no catalogued `gog-readonly`
      rule matches, and the harness offers "don't ask again for `gog *`",
      which would also allow send, share and delete (GH-1667).
    related:
      - dev10x:gog
      - dev10x:diag-friction
