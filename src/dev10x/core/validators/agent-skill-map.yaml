# DX020 agent-brief keyword map (GH-1835).
#
# Each entry names a sanctioned skill and the brief wording that means a
# subagent is about to do that skill's job. When an `Agent` prompt matches
# any `patterns` regex (case-insensitive) but names neither `skill` nor any
# `accept` alias, DX020 reports it. A brief opts out with a line
# `dev10x-ok: <reason>`.
#
# Names match as whole tokens (word characters, `:`, `-`, `.` and `/`),
# never as a substring: `my_push_safe` and `src/push_safe.py` do not name
# `push_safe`. An MCP tool counts only under its full registered name, so
# list it as an alias. An alias with other characters, such as
# `Skill(test)`, must appear as written, ignoring case.
#
# Projects adjust the map in their friction.yaml `projects[]` entry:
#
#   dx020:
#     mode: advisory          # advisory (default) | deny
#     skill_keywords:
#       add:
#         - skill: my:deploy
#           patterns: ['\bkubectl apply\b']
#       remove: [dev10x:git-commit]
#
# Patterns aim at the action, not the noun: "commit" alone is in almost
# every brief, "git commit" is a subagent about to make one.

entries:
  - skill: dev10x-qa:qa-self
    patterns:
      - '\bplaywright\b'
      - '\bheadless (?:browser|chrome|chromium)\b'
    accept: [qa-self]

  - skill: dev10x:git-commit
    patterns:
      - '\bgit commit\b'
      - '\bcommit (?:the|your|these|all) (?:changes|work|edits)\b'
    accept: [git-commit]

  - skill: dev10x:gh-pr-create
    patterns:
      - '\bgh pr create\b'
      - '\b(?:open|create) (?:a |the )?(?:draft )?(?:pr|pull request)\b'
    accept: [gh-pr-create, create_pr, mcp__plugin_dev10x_cli__create_pr]

  - skill: dev10x:git
    patterns:
      - '\bgit push\b'
      - '\bforce[- ]push\b'
    accept: [push_safe, mcp__plugin_dev10x_cli__push_safe]

  - skill: dev10x:gh-pr-merge
    patterns:
      - '\bgh pr merge\b'
      - '\bmerge (?:the |this )?(?:pr|pull request)\b'
    accept: [gh-pr-merge, merge_pr, mcp__plugin_dev10x_cli__merge_pr]

  - skill: dev10x:git-groom
    patterns:
      - '\bgit rebase -i\b'
      - '\binteractive rebase\b'
      - '\bsquash (?:the )?(?:fixups?|commits)\b'
    accept: [git-groom, rebase_groom, mcp__plugin_dev10x_cli__rebase_groom]

  - skill: dev10x:py-test
    patterns:
      - '\bpytest\b'
    accept: [py-test, run_tests, mcp__plugin_dev10x_cli__run_tests, Skill(test)]
