# Validation rules — single source of truth for command blocking,
# skill redirection, and Edit/Write security enforcement.
#
# Used by:
#   - skill_redirect.py (Bash PreToolUse hook)
#   - validate-edit-write.py (Edit|Write PreToolUse hook)
#   - dev10x:diag-friction (skill — advisory only;
#     formerly dev10x:skill-reinforcement)
#
# Split by plugin (ADR-0034 Stage A3, GH-1590): this file holds core's
# rules and the shared `config:`; command-skill-map.d/<plugin>.yaml
# holds each plugin's. dev10x.core.config.loader merges core first,
# then the fragments in src/dev10x/core/plugins.yaml order, and the
# first matching rule wins — so a rule's file decides which rule
# answers a command several rules match. Generic shell-shape rules, the
# loop rules (including ci-loop-handrolled, deliberately) and the
# Edit|Write rules stay in core. Read the merged map with
# `load_document`, never this file alone.
#
# Per-project override: place a custom version at:
#   ~/.config/Dev10x/diag-friction.yaml
# The hook merges override rules (user entries take precedence).
#
# Schema:
#   config:
#     plugin_repo: URL for filing issues when skills instruct blocked commands
#
#   rules[]:
#     name:             unique identifier
#     matcher:          tool matcher (Bash | Edit|Write)
#     patterns:         list of regex patterns to match commands
#     match_position:   anywhere (default) | invocation — where a pattern
#                       is allowed to match. `invocation` restricts it to
#                       the tokens naming a program being RUN (each shell
#                       segment's executable, plus any `find -exec`
#                       argument), so a rule guarding a script path stops
#                       firing on commands that merely NAME the script —
#                       `pre-commit run --files <path>/git-push-safe.sh`,
#                       `mv <path>/git-push-safe.sh <path>/old.sh`
#                       (GH-1084). Set it on any rule whose patterns are
#                       script paths; leave it unset for rules that
#                       deliberately match a path as an argument.
#     except:           list of strings — if any present, rule is skipped
#     hook_block:       true to enforce via hook (exit 2), false for advisory only.
#                       Flipping false -> true is NOT a one-line change: the
#                       hook's fast path (`should_run`) short-circuits on
#                       `_QUICK_TOKENS` in skill_redirect.py, so a promoted
#                       rule whose literal pattern names none of those tokens
#                       ships registered, documented and inert (GH-1337).
#                       `test_literal_pattern_contains_a_quick_token` fails on
#                       that; the advisory rules that would hit it today are
#                       named by `test_advisory_rules_that_would_ship_inert_
#                       are_reported` (GH-1398). Add the gating token in the
#                       same change.
#     compensations[]:  list of remediation options (first = recommended)
#       type:           use-skill | split-commands | change-cwd | use-alias
#                       | use-file-flag | use-tool | use-alternative | file-issue
#       skill:          skill name (for use-skill)
#       tool:           tool name (for use-tool)
#       alias:          alias name (for use-alias)
#       guardrails:     what the skill enforces (for use-skill)
#       fallback:       what to do when the compensation cannot be
#                       applied — the skill is unavailable (use-skill),
#                       or the tool is absent from this session's tool
#                       surface (use-tool). A tool named here is NOT
#                       guaranteed to exist in every session (GH-1087).
#       description:    human-readable guidance
#     reason:           why this rule exists
#     related:          list of related skill names
#
#     Edit|Write specific fields:
#       file_pattern:     regex on full file path
#       file_names:       exact basename matches
#       file_prefixes:    basename prefix matches
#       file_substrings:  substring matches on full path
#       content_pattern:  regex on content being written (new_string or content)

config:
  plugin_repo: https://github.com/Dev10x-Guru/dev10x-claude

rules:
  # ── Bash command rules ─────────────────────────────────────

  - name: git-dir-worktree-pinning
    matcher: Bash
    # Reaches the engine through the `--git-dir` / `--work-tree` entries
    # in _QUICK_TOKENS (skill_redirect.py) — neither pattern names any
    # other token, so without them the block would ship inert (GH-1496).
    patterns:
      - "git\\s+--git-dir"
      - "git\\s+--work-tree"
    hook_block: true
    compensations:
      - type: use-alternative
        description: >
          Pin the worktree by directory, not by plumbing paths — but first
          settle which CWD mode you are in, with two separate Bash calls:
          `cd <worktree-path>`, then `pwd` (GH-1050).

            • pwd == the path → run plain `git <verb> ...`. Do NOT add
              `-C`: a `-C` whose path already equals CWD is denied as
              redundant, so the "always pin" habit backfires here.
            • pwd != the path → `git -C <worktree-path> <verb> ...`. One
              argument instead of two. No allow rule can cover it: a
              `*` before `:*` is literal, and the space form would also
              match `-c <cmd>` (GH-1472) — so it prompts. Route mutating
              verbs to dev10x:git / dev10x:git-groom.

          Never `cd <path>; <cmd>` as a recovery — chaining is blocked, and
          for an unattended agent that prompt is another silent wedge.
    reason: >
      GH-1028: `Agent`-spawned subagents may reset Bash CWD on every call,
      so workers that believed CWD persisted improvised
      `git --git-dir=<repo>/.git/worktrees/<wt> --work-tree=<wt> ...`. That
      shape matches no allow rule, and an unattended subagent cannot answer
      the resulting prompt — it wedges silently, leaving no denial trace in
      hook logs.

      GH-1050 corrected the remedy: whether CWD persists is
      spawn-depth-dependent (a depth-1 probe kept it; a depth-2 crew worker
      did not), so an unconditional `git -C` mandate is denied as redundant
      at the depths where `cd` did stick. The steer is the mode self-test,
      not a fixed spelling.

      GH-1496 made it blocking. GH-1472 established that no allow rule can
      cover the plumbing spelling — a `*` before `:*` is literal — so the
      shape always prompts, and a prompt an unattended agent cannot answer
      is worse than a deny that names the way out. `git -C <other-path>` is
      deliberately NOT blocked: when `pwd` != the target it is the only
      route left, and blocking it would turn a prompt into a dead end.
    related:
      - dev10x:foreman

  # ── Advisory-only Bash rules (hook_block: false) ───────────

  - name: python3-inline
    matcher: Bash
    patterns:
      - python3 -c
    hook_block: false
    compensations:
      - type: use-tool
        tool: Read
        description: Use the Read tool for file inspection
      - type: use-alternative
        description: Write a standalone uv script for complex processing
    reason: >
      Inline python3 -c is hook-blocked. Use the Read tool to
      inspect files, or write a standalone uv script for complex
      processing.

  - name: bash-n
    matcher: Bash
    patterns:
      - bash -n
    hook_block: false
    compensations:
      - type: use-alternative
        description: Use shellcheck for deeper analysis including quoting, portability, and style
    reason: >
      bash -n only checks syntax errors. shellcheck provides
      deeper analysis including quoting issues, portability
      warnings, and style suggestions.

  - name: uv-extra-dev
    matcher: Bash
    patterns:
      - uv run --extra dev
      - uv run --extra
    hook_block: false
    compensations:
      - type: use-alternative
        description: >
          Where dev dependencies resolve by default, drop the flag and
          use uv run directly. Keep `--extra dev` when the repo's test
          deps live in an optional extra — a bare run then fails with
          ModuleNotFoundError (GH-947).
    reason: >
      The --extra dev flag is unnecessary in dev10x-ai repos whose dev
      dependencies resolve by default — but this is repo-dependent, not
      universal: a repo declaring its test deps under an optional
      `dev` extra (this plugin repo included) needs
      `uv run --extra dev pytest`, and a bare `uv run pytest` there
      fails on the first test import. Verify the repo before dropping
      the flag.

  - name: mktmp-bash-fallback
    matcher: Bash
    patterns:
      - /tmp/Dev10x/bin/mktmp\.sh
      - bin/mktmp\.sh
    # GH-1084: the sibling script-path rule gets the same anchoring —
    # advisory rather than blocking, so a mention only cost a misleading
    # nudge, but steering someone linting the script toward the MCP tool
    # is noise either way.
    match_position: invocation
    hook_block: false
    compensations:
      - type: use-tool
        tool: mcp__plugin_dev10x_cli__mktmp
        guardrails: structured response, no Bash permission friction
        description: >
          Call the MCP tool with namespace, prefix, ext, and (optional)
          directory/create flags. The shell script is the deployed
          fallback and should only run inside other shell scripts that
          execute outside Claude's tool-use protocol.
    reason: >
      The bash fallback works but adds permission friction (Bash
      allow-rule needed) and returns plain stdout. The MCP tool
      returns structured JSON with the path, matches the file-
      not-pre-created semantics introduced by GH-39, and lives in
      the routing table for skills.
    related:
      - dev10x:git-commit
      - dev10x:gh-pr-create

  # GH-1590: ci-loop-handrolled steers to coding's ci_check_status and
  # gh-pr-monitor, but it stays in core with the other loop rules. A CI
  # loop must reach it before watch-loop-handrolled (whose backgrounded
  # exemption it does not share), and before any plugin's rules.
  - name: ci-loop-handrolled
    matcher: Bash
    patterns:
      - "while.*gh pr checks"
      - "for .*gh pr checks"
      - "sleep.*gh pr (checks|view)"
      - "gh pr (checks|view).*sleep"
    hook_block: true
    compensations:
      - type: use-tool
        tool: mcp__plugin_dev10x_cli__ci_check_status
        guardrails: server-side poll with wait=true, structured verdict
        description: >
          Call ci_check_status(wait=true) for a single server-side poll
          that returns a structured pass/fail/unknown verdict — no
          bespoke loop needed.
      - type: use-skill
        skill: dev10x:gh-pr-monitor
        guardrails: failure detection, fixup commits, re-monitor after push
        description: >
          Watching review comments, approval, or merge state rather
          than CI is STILL this skill — ci_check_status's CI focus is
          not a licence to hand-roll a watch for the non-CI signals.
          No MCP wrapper waits on review or merge state (`pr_get` is
          one-shot), so "my condition isn't CI" resolves to
          gh-pr-monitor, never to a loop (GH-1212).
    reason: >
      A hand-rolled while/sleep loop around `gh pr checks` reinvents
      ci_check_status(wait=true) and the gh-pr-monitor skill. The loop
      exits on the first tick, skips bot-review checks, and does no
      fixup/re-monitor — route to the wrapper/skill instead (GH-488 #22).

      The scope trap (GH-1212): "ci_check_status waits on CI, I want a
      standing watch on review activity — different thing, so the
      wrapper does not apply" is the rationalisation that defeated four
      prior correct uses of the wrapper in one session. A different
      signal changes which compensation applies, never whether a loop
      is allowed.

      Blocking, not advising (GH-1138): the shape is structurally
      un-allow-listable, so an advisory entry only speaks after the
      supervisor has already been interrupted — or, unattended, after
      the loop has already wedged on a prompt. A dispatcher that read
      ci_check_status as unable to wait out its bot legs hand-rolled
      exactly this loop and stalled on a Yes/No; the wrapper now takes
      `wait_for`, so the compensation is executable in that case too.
    related:
      - dev10x:gh-pr-monitor

  - name: watch-loop-handrolled
    matcher: Bash
    patterns:
      # (?s) so a `sleep` several lines below `do` still matches — patterns
      # compile without DOTALL, and every real poll loop is multiline, so the
      # single-line shapes these replaced could not see one (GH-1212).
      - "(?s)\\bwhile\\b.*?\\bdo\\b.*?\\bsleep\\b"
      - "(?s)\\buntil\\b.*?\\bdo\\b.*?\\bsleep\\b"
      - "(?s)\\bfor\\b.*?\\bdo\\b.*?\\bsleep\\b"
      - "watch -n"
    hook_block: true
    compensations:
      - type: use-alternative
        description: >
          Waiting on work already dispatched to subagents? Do not wait
          at all — the Agent tool delivers completion notifications on
          its own, so a poll adds permission prompts without adding
          information (GH-1132).
      - type: use-alternative
        description: >
          Waiting for a one-off condition ("tell me when X is ready")?
          Use Bash with `run_in_background: true` and a command that
          EXITS once the condition holds. One notification, no Monitor,
          no prompt. The validator reads the call's own
          `run_in_background` flag and lets exactly this shape through
          (GH-1456) — the rule's danger (a prompt or a blocking wait
          freezing an unattended turn) cannot occur for a call that is
          already running asynchronously, so this is not merely advice
          but the one shape this rule does not block.
      - type: use-alternative
        description: >
          For orchestration/heartbeat watching, arm the pre-approved
          watcher CLI instead: `dev10x foreman watch --scratchpad
          <run-dir>` (heartbeat stalls, base-branch movement, quota
          events from one process) — or `uv run dev10x foreman watch
          …` when the bare entry point is not installed as a uv tool
          and exits 127, e.g. inside a plugin-repo checkout (GH-947).
          For bespoke conditions, wrap the
          loop in a PEP 723 uv-shebang script under ~/.claude/tools/
          and invoke the bare script path (approve it once by its exact
          path — no folder-wide rule can match, GH-1472).
      - type: use-tool
        tool: mcp__plugin_dev10x_cli__ci_check_status
        guardrails: single server-side poll, structured verdict
        description: >
          When the loop is CI-shaped, ci_check_status(wait=true)
          replaces it (the gh-specific shapes are matched by
          ci-loop-handrolled above).
      - type: use-alternative
        description: >
          A Monitor until-loop is the LAST resort here, and only for
          genuine per-occurrence watching (one event per match, over
          time) — not for waiting out a single condition.
    reason: >
      Inline while/until/sleep and `watch -n` shapes are structurally
      un-allow-listable — small variations (adding a pipeline stage)
      re-trigger permission matching. Monitor tool commands are
      permission-matched exactly like Bash, and in an unattended
      session a prompted watch command freezes the orchestrator turn
      until a human returns (GH-879: a 7-hour overnight stall).
      NOTE (GH-1132): the harness's own standalone-`sleep` block
      recommends "Monitor with an until-loop", which lands on exactly
      the shape this rule flags — obeying that hint costs a rejection
      interactively and risks the GH-879 wedge unattended. The
      compensations above are ordered so the non-prompting shapes come
      first; prefer them over the hint.

      GH-1456: the second compensation above told callers to submit
      `run_in_background: true` and got them denied anyway — the
      validator matched the shape without ever looking at that flag.
      `SkillRedirectValidator._is_backgrounded` now reads
      `tool_input.run_in_background` off the raw payload and skips this
      rule alone when it is true; every other loop rule (including
      `ci-loop-handrolled` above and `for-loop-handrolled` below) is
      unaffected, since backgrounding does not fix what THEY guard
      against (a stale one-shot check, a skipped fixup/re-monitor step,
      or defeated allow-rule matching on a known list).

      Blocking, not advising (GH-1138): an advisory setting on a shape
      that can never be approved deterministically is the worst of both
      — it neither prevents the prompt nor answers it. The Monitor tool
      is now on the same PreToolUse validator chain as Bash, so a loop
      routed through Monitor to dodge the Bash hook is seen too —
      genuinely so only since GH-1211; from GH-1138 until then the
      matcher was registered but the entry point discarded every
      non-Bash payload before any validator ran.

      No `except` carve-out (GH-1212): this rule used to exempt
      `gh pr checks` / `gh pr view` so those shapes would land on
      ci-loop-handrolled's richer compensation. First-match-wins
      already does that — ci-loop-handrolled is listed above — so the
      carve-out only ever fired when ci-loop-handrolled had NOT
      matched, i.e. it let a loop escape both rules purely by
      mentioning `gh pr view`. The defect is the loop, not the command
      inside it.
    related:
      - dev10x:foreman
      - dev10x:gh-pr-monitor

  # Placed AFTER ci-loop-handrolled and watch-loop-handrolled: this is the
  # general loop case, and `;\s*do\b` also matches their shapes. First-match-
  # wins keeps a CI or watch loop on the rule carrying the richer
  # ci_check_status / `dev10x foreman watch` compensation (GH-1117).
  - name: for-loop-handrolled
    matcher: Bash
    patterns:
      - "^\\s*for\\s+\\w+\\s+in\\s"
      - ";\\s*do\\b"
      - "\\bxargs\\b"
    except:
      - "gh pr checks"
      - "gh pr view"
    hook_block: false
    compensations:
      - type: split-commands
        description: >
          Issue one Bash call per item, all in the SAME assistant message —
          the harness fans them out in parallel. Each call then matches the
          inner command's own allow-rule, which a loop wrapper defeats:
          the effective prefix becomes the loop construct, matching nothing.
          A loop over 8 branches is 8 parallel calls, not one prompt.
      - type: use-tool
        tool: Grep
        guardrails: internalizes iteration for count/search shapes
        description: >
          When the loop body is a search or per-file count, Grep with
          output_mode="count" / "files_with_matches" replaces it entirely.
    reason: >
      A `for`/`xargs` loop over a known list defeats allow-rule matching for
      commands that are individually pre-approved, converting N approved
      calls into one unmatchable command. Unlike the CI and watch loop rules,
      this needs no sleep and no gh payload — it is the general case, and
      currently produces a raw permission prompt with no steer (GH-1117).

      Parallel single-shot calls are strictly better here: same wall-clock
      (the harness fans them out), and the supervisor sees one approval
      scope per command rather than one opaque approval for the loop.
    related:
      - dev10x:diag-friction

  - name: cat-grep-pipeline
    matcher: Bash
    patterns:
      - "cat .*\\|.*grep"
      - "grep .*\\{[^}]*,[^}]*\\}"
    hook_block: false
    compensations:
      - type: use-tool
        tool: Grep
        guardrails: file search without pipe/brace core-harness friction
        description: >
          Use the Grep tool to search files. A `cat file | grep x`
          pipeline and a `grep x file.{a,b}` brace expansion both trip
          non-allow-listable core-harness checks (pipe, brace) — the
          Grep tool searches directly without the friction.
    reason: >
      `cat | grep` and brace-expansion `grep {a,b}` recur as friction
      because the pipe and brace shapes are not allow-listable core
      checks. The Grep tool covers both with no permission prompt
      (GH-488 #15/#28).

  - name: find-search
    matcher: Bash
    patterns:
      # `find … -exec <search-tool>` and name-glob searches — the
      # archetypal un-allowable find shape (GH-726 F2/F3).
      - "find .*-exec\\s+(grep|egrep|fgrep|rg|cat|wc|head|tail|sort|sed|awk)"
      - "find .*-(name|iname|path|regex)\\b"
      # Parens/brackets in a path argument — shell-escaped or quoted.
      # A plain `find <path> -type f` over a SvelteKit route group
      # (`routes/(app)/[id]/`) carries no -name/-path/-exec, so the two
      # patterns above miss it entirely (GH-1059).
      - "find [^|&;]*\\\\[()\\[\\]]"
      - "find [^|&;]*['\"][^'\"]*[()\\[\\]]"
    hook_block: false
    compensations:
      - type: use-tool
        tool: Grep
        guardrails: recursive search by glob/type, no Bash allow-rule, no find -exec
        description: >
          Use the Grep tool (wraps ripgrep) to search file contents — set
          glob/type and output_mode (files_with_matches / count) instead of
          `find … -exec grep`.
        fallback: >
          Only when the Grep tool is absent from this session's tool
          surface: `rg -l <pattern> -g '<glob>'`, already covered by
          Bash(rg:*).
      - type: use-tool
        tool: Glob
        guardrails: name-glob file discovery, no Bash allow-rule
        description: >
          Use the Glob tool to find files by name pattern instead of
          `find -name`. For a one-shot Bash search, `rg -l <pat> -g '<glob>'`
          is already covered by Bash(rg:*).
        fallback: >
          Only when the Glob tool is absent from this session's tool
          surface: `rg --files -g '<glob>'`, already covered by
          Bash(rg:*). Do NOT fall back to `find` — recommending it
          reinstates the friction this rule exists to remove.
      - type: use-alternative
        guardrails: single pre-approved Bash prefix, no tool-surface dependency
        description: >
          `rg --files -g '<glob>'` (name discovery) or
          `rg -l <pattern> -g '<glob>'` (content search). Available
          under Bash(rg:*) for any path inside the project or its
          registered additionalDirectories, so this is the
          recommendation to give when the session's tool surface is
          unknown or lacks Glob/Grep (GH-1087). It does NOT hold for
          paths outside those directories — a read of
          `~/.claude/settings*.json` trips the harness's path-scope
          gate no matter which verb is used; see `settings-file-read`
          (GH-1140).
    reason: >
      `find` is structurally un-allowable: `Bash(find:*)` does not reliably
      match embedded paths/pipes, and `find … -exec <cmd>` is independently
      blocked because -exec wraps an arbitrary command (defeating the inner
      tool's allow-rule). The fix is tool substitution, not a new allow-rule
      — steer searches to ripgrep / the Grep + Glob tools (GH-726 F2/F3,
      themes T1 + T3). Parenthesised path segments make this acute: two
      unattended workers wedged simultaneously on the same
      `find …/routes/\(app\)/…` shape, silent for 25–35 min with nothing
      recorded in the hook log, because a pending permission prompt is
      neither a block nor a denial (GH-1059).

      Tool substitution is conditional on tool availability, which this
      rule cannot check: a session whose surface lacks Glob answered the
      recommended `Glob` call with "No such tool available: Glob … find
      files with `find` via the Bash tool instead" — the harness and the
      map contradicting each other, leaving a friction diagnosis that
      could not be executed. Each use-tool compensation therefore
      carries a `fallback:`, and the `rg` alternative below is
      unconditional (GH-1087).

  - name: settings-file-read
    matcher: Bash
    patterns:
      - "(rg|grep|egrep|fgrep|cat|jq|head|tail|less|awk|sed)\\b[^|&;]*\\.claude/settings(\\.local)?\\.json"
    except: []
    hook_block: true
    compensations:
      - type: use-tool
        tool: mcp__plugin_dev10x_cli__permission_catalog_gap
        guardrails: read-only catalog coverage per settings file, no path-scope gate
        description: >
          Use permission_catalog_gap for "does this settings file carry
          the catalog?" — the coverage question. This is the default for
          rule-coverage work: it answers directly instead of grepping
          JSON, and a non-zero total_missing names a propagation gap
          rather than a missing rule.
      - type: use-tool
        tool: mcp__plugin_dev10x_cli__audit_analyze_permissions
        guardrails: friction analysis over a session transcript
        description: >
          Use audit_analyze_permissions to analyse the friction a
          recorded session actually hit. It takes a required
          transcript_path, so it answers "what prompted, and why",
          NOT "is this rule present" — GH-1175 found it named as the
          default for the coverage question it cannot answer.
      - type: use-tool
        tool: Read
        guardrails: raw file contents, declared in diag-friction allowed-tools
        description: >
          Use the Read tool for the raw file, e.g.
          Read(~/.claude/settings.json). Read is not subject to the
          Bash path-scope gate.
    reason: >
      `Bash(rg:*)` is present and matching — the differentiator is the
      target. `~/.claude` is deliberately NOT a registered working
      directory (the catalog lists `~/.claude/memory`,
      `~/.claude/plugins` and `~/.config/Dev10x`, not `~/.claude`
      itself), so the harness's additionalDirectories path-scope gate
      fires and no allow rule can suppress it (GH-99). The shape is
      therefore un-allow-listable and must be denied deterministically
      with a steer rather than advised after the supervisor has already
      been interrupted (GH-1140).

      Denying it also removes the prompt's option 2 — registering
      `~/.claude` as a working directory — from the supervisor's
      screen. Accepting that option under `defaultMode: acceptEdits`
      with an empty project `ask` floor would let an agent edit
      `~/.claude/settings.json` unprompted, which is a far larger grant
      than the read that triggered it.

      Two sanctioned surfaces already exist and were never named at the
      point of friction; both compensations above are unconditional.
      Reads of `~/.config/Dev10x/*.yaml` and of repo paths are
      unaffected — that directory IS registered.
    related:
      - dev10x:diag-friction

  - name: fish-interactive-abbr
    matcher: Bash
    patterns:
      - "fish -ic"
      - "fish -i -c"
    hook_block: false
    compensations:
      - type: use-alternative
        description: >
          Run the underlying command directly, or invoke the documented
          Dev10x skill/alias the abbreviation maps to. fish abbreviations
          only expand in an interactive shell; spawning `fish -ic` to
          expand one is avoidable friction.
    reason: >
      `fish -ic <abbr>` expands a shell abbreviation by launching an
      interactive subshell — friction with no allow-rule. Run the real
      command or the documented skill/alias instead (GH-488 #18).

  - name: version-pinned-plugin-script
    matcher: Bash
    patterns:
      - "plugins/cache/.*/[0-9]+\\.[0-9]+\\.[0-9]+/"
      - "/cache/.*/[0-9]+\\.[0-9]+\\.[0-9]+/.*\\.py"
    # GH-1084: deliberately NOT match_position: invocation. The rotting
    # path is the defect wherever it appears — reading, copying, or
    # passing one as an argument all break on the next upgrade — so this
    # rule is about the path itself, not about executing it. Advisory,
    # so a mention costs a nudge rather than a block.
    hook_block: false
    compensations:
      - type: use-alternative
        description: >
          Route UP to the stable surface: invoke the skill via Skill()
          or call the installed `dev10x` CLI. Never call a script at a
          version-pinned plugins/cache/<version>/ path — the path rots
          on the next plugin upgrade.
    reason: >
      A version-pinned `…/cache/<version>/…/*.py` script path degrades
      on every plugin upgrade. Route up to the skill invocation or the
      stable installed CLI so the call survives version bumps (GH-488 #26).

  - name: gog-global-flags-first
    matcher: Bash
    patterns:
      - "^\\s*gog\\s+--?[A-Za-z]"
    except:
      - "gog --version"
      - "gog --help"
    # Advisory: a leading flag is not unsafe, it only stops the catalogued
    # read rules from matching. permission_triage and diag-friction read
    # advisory rules; the hook never sees them.
    hook_block: false
    compensations:
      - type: use-alternative
        description: >
          Move gog's global flags after the subcommand path:
          `gog chat messages list spaces/<id> -a <account> --readonly
          --json`, not `gog -a <account> --readonly chat messages list …`.
          gog accepts every global flag after the path, and only that
          order lets `Bash(gog chat messages list:*)` match.
    reason: >
      Allow rules match a command prefix. `gog -a <account> --readonly chat
      messages list …` starts with the flags, so no catalogued `gog-readonly`
      rule matches, and the harness offers "don't ask again for `gog *`",
      which would also allow send, share and delete (GH-1667).
    related:
      - dev10x:gog
      - dev10x:diag-friction

  # ── Edit|Write rules ───────────────────────────────────────

  - name: eval-in-skills
    matcher: "Edit|Write"
    file_pattern: '/\.claude/skills/.*\.(md|sh)$'
    content_pattern: '\beval\s+["$]'
    hook_block: true
    message: >
      eval is not allowed in skill files — it executes arbitrary
      code via double expansion.
    compensations:
      - type: use-alternative
        description: 'Use source <(script.sh) instead of eval "$(script.sh)"'
      - type: file-issue
        description: >
          If a skill explicitly instructs using eval, file an issue
          at the plugin repo — the skill instructions need updating.
    reason: >
      eval executes arbitrary code via double expansion and is
      not allowed in skill files.

  - name: sensitive-files
    matcher: "Edit|Write"
    file_names: [".env", "secrets.env", ".secret"]
    file_prefixes: [".env.", "secrets.env."]
    # `credentials` used to be a `file_substrings` entry, which matches
    # anywhere in the full path — so `credentials.py`,
    # `test_credentials.py` and `credentials-setup.md` were all
    # hard-blocked, told to ask a human to hand-edit them (GH-1287).
    #
    # The discriminator is the EXTENSION, not the name: a credential
    # store is `credentials` or `application_default_credentials.json`;
    # a module that talks to one is `credentials.py`. So keep matching
    # the word anywhere in the path — which is what covers
    # `credentials.d/` directories and descriptive names like
    # `service-account-credentials.json` — and exempt source and prose
    # extensions instead. Listing exact basenames was tried and dropped:
    # it admitted every decorated name, which is most real ones.
    file_pattern: >-
      (?i)^(?!.*\.(?:py|pyi|ts|tsx|js|jsx|mjs|go|rs|rb|java|kt|swift|c|h|cc|cpp|sh|bash|zsh|md|rst|txt)$).*credentials.*$
    hook_block: true
    message: "BLOCKED: Editing sensitive file: {file_path}"
    compensations:
      - type: use-alternative
        description: >
          Sensitive files must not be edited by Claude. Ask the user
          to make changes manually.
    reason: >
      Prevents accidental exposure or modification of secrets,
      credentials, and environment-specific configuration.
